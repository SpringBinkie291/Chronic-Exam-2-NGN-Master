coccal GN."},{"t":"Hypertension is a common finding.","c":true,"r":"Damaged glomeruli activate renin and retain sodium and water, raising BP."},{"t":"It may develop over 20 to 30 years and progress to ESRD.","c":true,"r":"Chronic GN is slow, permanent fibrosis of the glomeruli that can end in dialysis or transplant."},{"t":"Cyclophosphamide may be used if the disease doesn't respond to corticosteroids.","c":true,"r":"Cytotoxic agents suppress the immune response in steroid-resistant cases."},{"t":"White blood cell casts are the hallmark finding.","c":false,"r":"WBC casts point to pyelonephritis (infection in the renal parenchyma)."},{"t":"Urinalysis is expected to show proteinuria, hematuria, and red blood cell casts.","c":true,"r":"Damaged glomeruli leak protein and RBCs. RBC casts confirm the bleeding comes from the glomerulus."}],"takeaway":"Glomerulonephritis = glomerulus: protein, blood, RBC casts, HTN. Pyelonephritis = infection: WBC casts, fever, flank pain.","fixed":false},{"id":"G02","cat":"Genitourinary","sub":"Urosepsis","step":"Prioritize Hypotheses","type":"mc","stem":"A 68-year-old client admitted with pyelonephritis has these findings 6 hours after admission: T 102.9°F (39.4°C), HR 118, BP 86/50, RR 26, and new confusion. Which action should the nurse take first?","options":[{"t":"Encourage the client to drink 3 L of fluid today.","c":false,"r":"Oral fluids are too slow and unreliable for a client who is hypotensive and confused."},{"t":"Teach the client about perineal hygiene.","c":false,"r":"Teaching isn't appropriate for an unstable, confused client."},{"t":"Give phenazopyridine for urinary discomfort.","c":false,"r":"Comfort measures don't address the life-threatening problem."},{"t":"Notify the provider or rapid response team for suspected urosepsis.","c":true,"r":"Fever, tachycardia, hypotension, tachypnea, and altered mental status signal sepsis. Rapid escalation gets cultures, IV fluids, and IV antibiotics started immediately."}],"takeaway":"With pyelonephritis, always watch for urosepsis. Hypotension plus a change in mental status means escalate now.","fixed":false},{"id":"F07","cat":"Reproductive","sub":"Breast Cancer: Post-Mastectomy","step":"Take Action","type":"sata","stem":"A client is being discharged after a modified radical mastectomy with axillary lymph node dissection. Which instructions should the nurse include? Select all that apply.","options":[{"t":"Avoid letting the arm hang down for long periods.","c":true,"r":"A dependent arm collects lymph fluid."},{"t":"Wear gloves when gardening or washing dishes.","c":true,"r":"Cuts and infections increase lymph production and can trigger lymphedema."},{"t":"Take your pain medicine about 30 minutes before your arm exercises.","c":true,"r":"Restoring arm function is a key nursing goal. Premedicating makes exercises tolerable."},{"t":"Use a hot tub or sauna to relieve muscle tightness.","c":false,"r":"Heat and burns increase fluid in the arm."},{"t":"Exercise regularly and keep a healthy weight.","c":true,"r":"Both lower lymphedema risk."},{"t":"Don't allow blood pressures, blood draws, or injections in the arm on the surgical side.","c":true,"r":"Compression and needle sticks can trigger lymphedema and infection in an arm with impaired lymph drainage."},{"t":"Carry your purse and groceries on the surgical side to build strength.","c":false,"r":"Heavy loads on the affected arm increase the risk of lymphedema."}],"takeaway":"If lymphedema develops: complete decongestive therapy (massage-like technique), compression bandaging or a pneumatic sleeve, elevate the arm level with the heart, isometric exercises.","fixed":false},{"id":"N11","cat":"Neurological","sub":"Multiple Sclerosis","step":"Take Action","type":"sata","stem":"Which instructions should the nurse include when teaching a client with relapsing-remitting MS? Select all that apply.","options":[{"t":"Do strenuous workouts every day to rebuild strength quickly.","c":false,"r":"Regular, moderate activity and stretching are encouraged; overexertion worsens fatigue."},{"t":"Avoid hot tubs, saunas, and exercising in hot weather.","c":true,"r":"Heat worsens symptoms (Uhthoff's sign)."},{"t":"Stop your disease-modifying therapy once you're in remission.","c":false,"r":"DMTs are continued to prevent relapses; delays in treatment are linked to poor outcomes."},{"t":"Plan rest periods and prioritize tasks to save energy.","c":true,"r":"Fatigue is one of the most disabling MS symptoms."},{"t":"Check bath water with a thermometer before getting in.","c":true,"r":"Sensory deficits increase the risk of burns."},{"t":"Drink about 2,000 mL of fluid daily and eat a high-fiber diet.","c":true,"r":"Prevents constipation and urinary tract infections."}],"takeaway":"MS goals: maximize function, keep ADL independence, manage fatigue, support psychosocial well-being, reduce triggers. Resource: National Multiple Sclerosis Society.","fixed":false},{"id":"F12","cat":"Reproductive","sub":"Endometriosis","step":"Take Action","type":"sata","stem":"A 29-year-old with endometriosis reports painful periods, pain with intercourse, and difficulty getting pregnant. She is starting leuprolide, a GnRH agonist. Which effects should the nurse teach her to expect? Select all that apply.","options":[{"t":"Hot flashes","c":true,"r":"A common menopausal side effect of low estrogen."},{"t":"Possible loss of bone density with long-term use","c":true,"r":"Low estrogen reduces bone density, which limits how long the drug is used."},{"t":"Absence of menstrual periods","c":true,"r":"Leuprolide suppresses ovarian hormones, creating a temporary medical menopause so the ectopic tissue stops being stimulated."},{"t":"Heavier menstrual bleeding","c":false,"r":"Periods typically stop."},{"t":"Increased fertility while taking the medication","c":false,"r":"Leuprolide suppresses ovulation while in use."},{"t":"Vaginal dryness","c":true,"r":"Another effect of low estrogen."}],"takeaway":"Endometriosis: endometrial tissue outside the uterus (ovaries, uterosacral ligaments) that still responds to hormones. Classic signs: dysmenorrhea, dyspareunia, infertility, pelvic pain, abnormal bleeding. Treatment: watch and wait, OCPs, NSAIDs, GnRH agonists, surgery.","fixed":false},{"id":"A05","cat":"Ear","sub":"Hearing Loss","step":"Take Action","type":"mc","stem":"A client receiving IV gentamicin reports ringing in both ears and feeling unsteady when walking. Which action should the nurse take first?","options":[{"t":"Irrigate both ears to remove cerumen.","c":false,"r":"The symptoms are drug-related, not from wax."},{"t":"Schedule a hearing test after discharge.","c":false,"r":"Waiting allows continued exposure and permanent damage."},{"t":"Reassure the client that the ringing is expected and will go away.","c":false,"r":"Ignoring early ototoxicity risks permanent damage."},{"t":"Hold the next dose and notify the provider.","c":true,"r":"Tinnitus and balance problems are signs of ototoxicity, which can cause permanent sensorineural hearing loss."}],"takeaway":"Sensorineural (inner ear or nerve): aging, noise, genetics, ototoxic drugs such as aminoglycosides, loop diuretics, and chemotherapy; treated with hearing aids. Conductive (outer or middle ear): wax, fluid, infection, eardrum or ossicle problems; treated medically or surgically.","fixed":false},{"id":"E04","cat":"Eye","sub":"Glaucoma","step":"Analyze Cues","type":"sata","stem":"Which findings indicate acute angle-closure glaucoma rather than primary open-angle glaucoma? Select all that apply.","options":[{"t":"Intraocular pressure of 54 mm Hg","c":true,"r":"In AACG, IOP may exceed 50 mm Hg."},{"t":"Colored halos around lights and blurred vision","c":true,"r":"Corneal edema from the sudden pressure rise causes halos and blurring."},{"t":"No pain or pressure sensation","c":false,"r":"Open-angle glaucoma develops without pain."},{"t":"Gradual loss of peripheral vision over several years","c":false,"r":"Slow, painless tunnel vision is typical of open-angle glaucoma."},{"t":"IOP of 26 mm Hg found on a routine eye exam","c":false,"r":"Open-angle glaucoma pressures are usually 22 to 32 mm Hg."},{"t":"Nausea and vomiting","c":true,"r":"Often accompanies the sudden pressure spike."},{"t":"Sudden, severe pain in and around the eye","c":true,"r":"Rapid pressure rise causes intense pain."}],"takeaway":"Normal IOP is 10 to 21 mm Hg. Open angle: drainage is clogged, slow and painless. Angle closure: the iris blocks the angle, causing a sudden emergency.","fixed":false},{"id":"G06","cat":"Genitourinary","sub":"UTI in Older Adults","step":"Recognize Cues","type":"sata","stem":"An 84-year-old resident of a memory care unit has moderate dementia. Which findings should prompt the nurse to assess for a urinary tract infection? Select all that apply.","options":[{"t":"New urinary incontinence in a resident who was previously continent","c":true,"r":"New incontinence can result from urgency and bladder irritation."},{"t":"A fall this morning while walking to the bathroom","c":true,"r":"Urgency, frequency, and acute confusion from infection increase fall risk."},{"t":"Short-term memory loss unchanged from baseline","c":false,"r":"Stable, baseline cognitive deficits are expected with dementia."},{"t":"Sudden increase in confusion and agitation over the past day","c":true,"r":"In older adults, an acute change in mental status is often the first or only sign of UTI. Always rule out infection when confusion changes suddenly."},{"t":"Eats about 75% of meals, which is the resident's usual intake","c":false,"r":"This is the resident's baseline and isn't a new cue."},{"t":"Cloudy, foul-smelling urine","c":true,"r":"This suggests bacteria and pyuria."}],"takeaway":"Older adults often have atypical UTI presentations: confusion, falls, new incontinence, poor appetite, often without fever.","fixed":false},{"id":"R09","cat":"Renal","sub":"Chronic Kidney Disease","step":"Prioritize Hypotheses","type":"sata","stem":"A client with stage 5 CKD missed two hemodialysis sessions and arrives at the clinic. Which findings require immediate action by the nurse? Select all that apply.","options":[{"t":"New confusion and difficulty following commands","c":true,"r":"A change in mental status suggests uremic encephalopathy or a severe electrolyte imbalance."},{"t":"Pericardial friction rub","c":true,"r":"A rub suggests uremic pericarditis, which can lead to effusion and cardiac tamponade."},{"t":"Tall, peaked T waves on the cardiac monitor","c":true,"r":"Peaked T waves signal hyperkalemia, which can progress to lethal dysrhythmias."},{"t":"Ammonia-like odor to the breath","c":false,"r":"Uremic breath (salivary urease breaks urea into ammonia) is expected with uremia and is not the most urgent finding."},{"t":"Reports feeling tired","c":false,"r":"Fatigue from anemia and uremia is expected in ESRD."},{"t":"Crackles in both lung bases with SpO2 88% on room air","c":true,"r":"These are signs of fluid overload with pulmonary edema, a breathing priority."},{"t":"Reports dry, itchy skin","c":false,"r":"Pruritus is common in CKD and is managed with unscented lotions. It is not an emergency."}],"takeaway":"Sort expected CKD findings (itching, fatigue, uremic breath) from the dangerous ones: hyperkalemia, pulmonary edema, pericarditis, and mental status changes.","fixed":false},{"id":"G04","cat":"Genitourinary","sub":"UTI Prevention","step":"Generate Solutions","type":"sata","stem":"A 26-year-old woman has had three episodes of cystitis this year. Which instructions should the nurse include to prevent recurrence? Select all that apply.","options":[{"t":"Empty your bladder before and after sexual intercourse.","c":true,"r":"Voiding flushes out bacteria introduced during intercourse."},{"t":"Drink adequate fluids every day.","c":true,"r":"Fluids dilute the urine and promote frequent flushing of the bladder."},{"t":"Stop the antibiotic once the burning goes away.","c":false,"r":"The full course must be completed to prevent relapse and resistance."},{"t":"Void about every 3 to 4 hours during the day.","c":true,"r":"Regular voiding prevents urinary stasis, which lets bacteria multiply."},{"t":"Use a vinegar douche weekly to keep the area clean.","c":false,"r":"Douching disrupts normal vaginal flora and increases infection risk."},{"t":"Wipe from front to back after urinating or a bowel movement.","c":true,"r":"This keeps fecal bacteria, the main cause of UTI, away from the short female urethra."},{"t":"Take bubble baths to soothe the area.","c":false,"r":"Bubble baths, powders, sprays, and harsh soaps irritate the urethra."}],"takeaway":"UTI prevention: front to back, void before and after sex, void every 3 to 4 hours, adequate fluids, no douches or bubble baths, finish antibiotics.","fixed":false},{"id":"N17","cat":"Neurological","sub":"Myasthenia Gravis","step":"Analyze Cues","type":"sata","stem":"A client with myasthenia gravis took extra doses of pyridostigmine and now reports increased weakness. The nurse notes excessive salivation, sweating, abdominal cramping, diarrhea, and increased bronchial secretions. Which statements are accurate? Select all that apply.","options":[{"t":"Atropine should be readily available as the antidote.","c":true,"r":"Atropine blocks the excess cholinergic effects."},{"t":"The nurse should give another dose of pyridostigmine.","c":false,"r":"More drug worsens cholinergic crisis. Anticholinesterase drugs are held."},{"t":"This crisis results from too much anticholinesterase medication.","c":true,"r":"Excess drug leaves too much acetylcholine at the receptors."},{"t":"This crisis is usually triggered by missed doses or an infection.","c":false,"r":"That describes myasthenic crisis (undermedication)."},{"t":"The client is most likely in cholinergic crisis.","c":true,"r":"Weakness plus excess cholinergic signs points to overmedication."},{"t":"Airway and breathing are the priority assessments.","c":true,"r":"Both types of crisis can cause respiratory failure. Be ready to suction and support ventilation."}],"takeaway":"Myasthenic crisis = too little drug, infection, or stress: weakness, ptosis, dysphagia, dyspnea. Cholinergic crisis = too much drug: weakness plus salivation, sweating, cramping, diarrhea, secretions.","fixed":false},{"id":"F03","cat":"Reproductive","sub":"Breast Cancer","step":"Recognize Cues","type":"sata","stem":"The nurse palpates a breast mass during a client's exam. Which characteristics are most suggestive of breast cancer? Select all that apply.","options":[{"t":"Hard","c":true,"r":"Malignant masses are typically hard."},{"t":"Irregular, poorly defined borders","c":true,"r":"Cancer invades surrounding tissue, so its edges are hard to define."},{"t":"Tender lumps in both breasts that worsen before menses","c":false,"r":"This pattern fits fibrocystic breast condition."},{"t":"Overlying skin with an orange-peel (peau d'orange) appearance","c":true,"r":"Cancer cells blocking lymph channels in the skin cause thickened, pitted skin. This is classic for inflammatory breast cancer."},{"t":"Nontender","c":true,"r":"Malignant lumps are usually painless, which is one reason people delay care."},{"t":"Fixed to underlying tissue (nonmobile)","c":true,"r":"Attachment to deeper tissue suggests invasion."},{"t":"Round, rubbery, and freely movable","c":false,"r":"These features are typical of a fibroadenoma."}],"takeaway":"Malignant: hard, irregular, fixed, nontender, nipple retraction or discharge, peau d'orange. Benign: smooth, mobile, often tender.","fixed":false},{"id":"P03","cat":"Pediatric GU","sub":"Pediatric UTI","step":"Generate Solutions","type":"sata","stem":"The nurse is teaching the parents of a 5-year-old girl who was just treated for her second UTI. Which instructions should the nurse include? Select all that apply.","options":[{"t":"Encourage her to void often and not hold her urine.","c":true,"r":"Urinary stasis lets bacteria multiply."},{"t":"Stop the antibiotic once her fever is gone.","c":false,"r":"The full course is needed to clear the infection."},{"t":"Limit fluids in the afternoon to prevent accidents.","c":false,"r":"Fluids flush bacteria; intake should be increased."},{"t":"Dress her in snug nylon underwear.","c":false,"r":"Loose cotton underwear lets the area breathe."},{"t":"Avoid bubble baths.","c":true,"r":"Bubble baths irritate the urethra and are a known risk factor in girls."},{"t":"Teach her to wipe from front to back.","c":true,"r":"About 80% of UTIs are caused by fecal bacteria."}],"takeaway":"Girls: short urethra, hygiene, bubble baths. Boys: uncircumcised infants under 1 year and congenital anomalies. Also: vesicoureteral reflux, stasis, obstruction.","fixed":false},{"id":"E06","cat":"Eye","sub":"Glaucoma","step":"Take Action","type":"sata","stem":"The nurse is teaching a client with primary open-angle glaucoma how to instill timolol and latanoprost. Which instructions should the nurse include? Select all that apply.","options":[{"t":"Touch the dropper tip to your eye to be sure the drop goes in.","c":false,"r":"This contaminates the bottle and can injure the cornea."},{"t":"Stop the drops once your eye pressure is back to normal.","c":false,"r":"Open-angle glaucoma has no cure. Drops are lifelong to prevent optic nerve damage."},{"t":"Wash your hands before instilling the drops.","c":true,"r":"Prevents eye infection."},{"t":"Put the drop into the pocket made by gently pulling down the lower lid.","c":true,"r":"The conjunctival sac holds the drop without stimulating blinking off the cornea."},{"t":"Press gently on the inner corner of the eye for at least 1 minute after each drop.","c":true,"r":"Punctal occlusion keeps the drug in the eye and reduces systemic absorption, which matters with beta-blockers."},{"t":"Wait at least 5 minutes between the two different drops.","c":true,"r":"This keeps the second drop from washing out the first."}],"takeaway":"Drug therapy is the first treatment for open-angle glaucoma. Adherence and correct technique prevent permanent vision loss.","fixed":false},{"id":"N15","cat":"Neurological","sub":"Restless Legs Syndrome","step":"Take Action","type":"mc","stem":"Which instruction should the nurse give a client with restless legs syndrome?","options":[{"t":"Avoid warm baths before bed.","c":false,"r":"Warm baths, massage, and stretching before bed can help."},{"t":"Avoid over-the-counter sleep aids that contain diphenhydramine.","c":true,"r":"Antihistamines can worsen RLS symptoms."},{"t":"Sit completely still for 30 minutes when symptoms start.","c":false,"r":"Inactivity worsens the urge to move."},{"t":"Have a cup of coffee after dinner.","c":false,"r":"Caffeine, alcohol, and tobacco worsen symptoms."}],"takeaway":"RLS drugs: dopamine agonists (pramipexole, ropinirole) are first choice for nightly symptoms; gabapentin or opiates for painful symptoms. Also: regular sleep habits, relaxation, leg massage.","fixed":false},{"id":"G05","cat":"Genitourinary","sub":"UTI Medications","step":"Evaluate Outcomes","type":"mc","stem":"The nurse teaches a client about phenazopyridine. Which client statement indicates understanding?","options":[{"t":"“I'll take this for the next 2 weeks.”","c":false,"r":"It's used short term (usually about 2 days). Longer use can mask a worsening infection."},{"t":"“Since this stops the burning, I can stop my antibiotic.”","c":false,"r":"Symptom relief doesn't mean the infection is gone. The antibiotic must be finished."},{"t":"“This medicine will kill the bacteria causing my infection.”","c":false,"r":"Phenazopyridine is a urinary analgesic only. It has no antibacterial effect."},{"t":"“My urine will turn reddish-orange, and it can stain clothing and contact lenses.”","c":true,"r":"This is an expected, harmless effect of the drug."}],"takeaway":"Phenazopyridine = symptom relief and orange urine. It never replaces the antibiotic.","fixed":false},{"id":"R05","cat":"Renal","sub":"Chronic Kidney Disease","step":"Take Action","type":"mc","stem":"A client with CKD mineral and bone disorder (CKD-MBD) is prescribed calcium acetate, a phosphate binder. Which instruction should the nurse give?","options":[{"t":"Take it with each meal or snack.","c":true,"r":"Phosphate binders must be taken with food so they bind dietary phosphorus, which is then excreted in the stool instead of absorbed."},{"t":"Take it on an empty stomach 1 hour before meals.","c":false,"r":"Binders work by grabbing phosphorus from food in the gut. Taken away from food, there is nothing to bind."},{"t":"Take it at bedtime so it works overnight.","c":false,"r":"No food is in the gut overnight, so the dose would be wasted."},{"t":"Take it only on days your skin feels itchy.","c":false,"r":"Itching is linked to high phosphorus, but binders are scheduled with every meal, not taken as needed."}],"takeaway":"Phosphate binders go with meals. Pair them with vitamin D to raise calcium and a dietitian referral for phosphorus teaching.","fixed":false},{"id":"N06","cat":"Neurological","sub":"Chronic Stroke","step":"Take Action","type":"mc","stem":"The nurse is completing the NIH Stroke Scale (NIHSS). Which action is correct?","options":[{"t":"Change an earlier item score if the client does better later in the exam.","c":false,"r":"Scores are not changed once recorded."},{"t":"Complete the items in whatever order is convenient.","c":false,"r":"Items are rated in the order listed."},{"t":"Interpret a higher total score as a less severe stroke.","c":false,"r":"Scores range from 0 to 42; higher scores mean more severe deficits."},{"t":"Score what the client actually does, not what the nurse thinks the client can do.","c":true,"r":"The NIHSS reflects observed performance only."}],"takeaway":"NIHSS: 15 items, scored 0 to 42, rated in order, never go back, score what the patient does. It predicts short- and long-term outcomes.","fixed":false},{"id":"R10","cat":"Renal","sub":"Chronic Kidney Disease","step":"Take Action","type":"mc","stem":"The nurse is preparing to give epoetin alfa subcutaneously to a client with CKD. Which data should the nurse review before giving the medication?","options":[{"t":"Serum potassium level","c":false,"r":"Potassium matters in CKD, but it isn't the key safety check for an ESA."},{"t":"Urine specific gravity","c":false,"r":"This reflects the kidney's concentrating ability and doesn't guide ESA dosing."},{"t":"Blood pressure and hemoglobin level","c":true,"r":"ESAs can raise BP and increase the risk of thrombosis and stroke when hemoglobin rises too high (the target generally stays at or below about 11 g/dL). Hold and notify the provider if Hgb is above target or BP is uncontrolled."},{"t":"Capillary blood glucose","c":false,"r":"Blood glucose doesn't affect ESA administration."}],"takeaway":"Before an ESA: check hemoglobin (don't overshoot) and BP. Iron stores must also be adequate for the drug to work.","fixed":false},{"id":"F10","cat":"Reproductive","sub":"Endometrial Cancer","step":"Analyze Cues","type":"sata","stem":"A 62-year-old client who is obese, has type 2 diabetes, and has never been pregnant reports vaginal spotting. Her last menstrual period was 10 years ago. Which statements are accurate? Select all that apply.","options":[{"t":"Treatment commonly includes total hysterectomy with bilateral salpingo-oophorectomy.","c":true,"r":"Surgery is the main treatment, with chemotherapy or radiation as needed."},{"t":"A transvaginal ultrasound and endometrial biopsy are expected.","c":true,"r":"These are the standard diagnostic tests."},{"t":"Postmenopausal bleeding requires prompt evaluation.","c":true,"r":"Abnormal uterine bleeding, especially after menopause, is the hallmark sign of endometrial cancer."},{"t":"Light spotting is a normal part of aging after menopause.","c":false,"r":"Any postmenopausal bleeding is abnormal until proven otherwise."},{"t":"Her obesity, diabetes, and never having been pregnant increase her risk.","c":true,"r":"These factors increase unopposed estrogen exposure; fat tissue converts androgens to estrogen."},{"t":"A Pap test is the screening test that detects endometrial cancer.","c":false,"r":"There is no routine screening test for endometrial cancer. The Pap test screens for cervical cancer."}],"takeaway":"Endometrial cancer is the most common GYN cancer. Risk: estrogen exposure, obesity, nulliparity, diabetes, family history of colorectal cancer.","fixed":false},{"id":"R02","cat":"Renal","sub":"Chronic Kidney Disease","step":"Analyze Cues","type":"mc","stem":"A client's eGFR has measured 38 mL/min/1.73 m² on three occasions over the past 4 months. The nurse recognizes this as which stage of chronic kidney disease?","options":[{"t":"Stage 2","c":false,"r":"Stage 2 is a GFR of 60 to 89 mL/min with evidence of kidney damage."},{"t":"Stage 3a","c":false,"r":"Stage 3a is a GFR of 45 to 59 mL/min."},{"t":"Stage 3b","c":true,"r":"Stage 3b is a GFR of 30 to 44 mL/min. Because the GFR has stayed below 60 for more than 3 months, this meets the definition of CKD."},{"t":"Stage 4","c":false,"r":"Stage 4 is a GFR of 15 to 29 mL/min. Stage 5 (ESRD) is below 15."}],"takeaway":"Know the cutoffs: 90 or above (1), 60 to 89 (2), 45 to 59 (3a), 30 to 44 (3b), 15 to 29 (4), below 15 (5). CKD = GFR below 60 for longer than 3 months.","fixed":true},{"id":"N20","cat":"Neurological","sub":"Amyotrophic Lateral Sclerosis","step":"Prioritize Hypotheses","type":"mc","stem":"The nurse is caring for a client with advanced ALS. Which finding requires the nurse's immediate action?","options":[{"t":"Visible twitching of the tongue","c":false,"r":"Fasciculations are expected in ALS."},{"t":"Excess drooling","c":false,"r":"Drooling is managed with glycopyrrolate and suctioning. It raises aspiration risk, but active respiratory distress comes first."},{"t":"Weak cough, respiratory rate of 30, and use of accessory muscles","c":true,"r":"Respiratory muscle weakness leads to respiratory failure, the most common cause of death in ALS."},{"t":"Painful muscle cramps in both calves","c":false,"r":"Cramps are managed with drugs like baclofen; they are not an emergency."}],"takeaway":"In ALS, airway and breathing come first. Watch for a weak cough, rising RR, accessory muscle use, and falling oxygen saturation.","fixed":false},{"id":"N13","cat":"Neurological","sub":"Multiple Sclerosis","step":"Analyze Cues","type":"mc","stem":"Which diagnostic findings support a diagnosis of multiple sclerosis?","options":[{"t":"Positive acetylcholine receptor antibodies","c":false,"r":"These support myasthenia gravis."},{"t":"Genetic testing showing expanded CAG repeats","c":false,"r":"This confirms Huntington disease."},{"t":"CSF with elevated IgG and an MRI showing plaques in two or more areas of the CNS","c":true,"r":"No single test diagnoses MS. Criteria require at least 2 demyelinating lesions in at least 2 CNS locations, 2 or more attacks at least 1 month apart, and other causes ruled out."},{"t":"CSF with low glucose and many neutrophils","c":false,"r":"This suggests bacterial meningitis."}],"takeaway":"MS types: relapsing-remitting (most common, about 85%), secondary progressive, primary progressive (10% to 15%), clinically isolated syndrome. Visual evoked potentials may show delayed conduction.","fixed":false},{"id":"E05","cat":"Eye","sub":"Glaucoma","step":"Take Action","type":"mc","stem":"A client arrives in the emergency department with suspected acute angle-closure glaucoma. Which prescription should the nurse expect first?","options":[{"t":"Acetazolamide and a hyperosmotic agent such as mannitol","c":true,"r":"These lower IOP quickly by reducing aqueous humor production and pulling fluid from the eye. A laser peripheral iridotomy then gives long-term treatment."},{"t":"Warm compresses and an eye patch","c":false,"r":"These don't lower IOP."},{"t":"Outpatient follow-up in 1 week","c":false,"r":"AACG is an emergency; delay can cause permanent vision loss."},{"t":"Atropine eye drops","c":false,"r":"Dilating the pupil pushes the iris further into the angle and worsens the blockage."}],"takeaway":"AACG: lower the pressure now (carbonic anhydrase inhibitor, hyperosmotic agent, miotic), then iridotomy or iridectomy to prevent recurrence. Avoid mydriatics.","fixed":false},{"id":"N07","cat":"Neurological","sub":"Parkinson's Disease","step":"Recognize Cues","type":"sata","stem":"The nurse is assessing a client being evaluated for Parkinson's disease. Which findings are consistent with this diagnosis? Select all that apply.","options":[{"t":"Writhing, twisting movements of the face and limbs","c":false,"r":"Chorea is characteristic of Huntington disease."},{"t":"Masklike face with infrequent blinking","c":true,"r":"Bradykinesia reduces spontaneous movement, including facial expression."},{"t":"Short, shuffling steps and trouble stopping once walking","c":true,"r":"Bradykinesia and postural instability cause a shuffling gait and propulsion."},{"t":"Ratchet-like cogwheel rigidity when the nurse moves the client's arm","c":true,"r":"Rigidity with jerky catches is a primary feature."},{"t":"Resting pill-rolling tremor of the right hand that lessens with purposeful movement","c":true,"r":"Resting tremor is often the first sign of PD."},{"t":"Tremor that worsens when reaching for a cup","c":false,"r":"An intention tremor points to cerebellar disease or MS."},{"t":"Symptoms that began on both sides of the body at the same time","c":false,"r":"PD usually starts on one side or in one limb."}],"takeaway":"PD = dopamine loss in the substantia nigra, leaving acetylcholine unopposed. TRAP: Tremor at rest, Rigidity, Akinesia (bradykinesia), Postural instability. Diagnosis needs 2 of the 4 with asymmetric onset and is confirmed by response to levodopa. Symptoms appear after 60% to 80% of dopamine neurons are lost.","fixed":false},{"id":"E03","cat":"Eye","sub":"Ophthalmic Medications","step":"Recognize Cues","type":"mc","stem":"Before cataract surgery, an older adult receives phenylephrine and cyclopentolate eye drops. Which finding requires the nurse's follow-up?","options":[{"t":"Pupils dilated and nonreactive to light","c":false,"r":"This is the intended effect."},{"t":"Heart rate 124 beats/min and new confusion","c":true,"r":"Systemic absorption of mydriatics (adrenergic) and cycloplegics (anticholinergic) can cause tachycardia and CNS effects. Older adults and children are most susceptible."},{"t":"Blurred near vision","c":false,"r":"Cycloplegics paralyze the ciliary muscle, so accommodation is lost. This is expected."},{"t":"Sensitivity to light","c":false,"r":"Expected with a dilated pupil. Teach the client to wear dark glasses."}],"takeaway":"Mydriatics dilate the pupil, miotics constrict it, and cycloplegics paralyze accommodation and dilate. Applying pressure to the inner canthus reduces systemic absorption.","fixed":false},{"id":"A06","cat":"Ear","sub":"Hearing Loss","step":"Take Action","type":"sata","stem":"The nurse is caring for an older adult with hearing loss who does not use sign language. Which communication strategies should the nurse use? Select all that apply.","options":[{"t":"Shout into the client's better ear.","c":false,"r":"Shouting distorts sound."},{"t":"Exaggerate lip movements and facial expressions.","c":false,"r":"This distorts lip patterns and makes speech reading harder."},{"t":"Raise your voice to a higher pitch.","c":false,"r":"High-pitched sounds are usually the first lost with age-related hearing loss. Speak normally or slightly lower."},{"t":"Rephrase a sentence the client didn't understand instead of repeating it.","c":true,"r":"Different words may contain sounds the client can hear."},{"t":"Face the client directly in a well-lit area.","c":true,"r":"Lets the client see your lips and expressions."},{"t":"Write out names or difficult words.","c":true,"r":"Visual aids supplement what the client hears."},{"t":"Turn off the TV and move away from background noise.","c":true,"r":"Background noise competes with speech."}],"takeaway":"Age-related ear changes: drier, thicker cerumen, tinnitus, auditory nerve degeneration, eardrum atrophy, high-frequency loss. Arrange a professional interpreter if the client uses sign language.","fixed":false},{"id":"N14","cat":"Neurological","sub":"Restless Legs Syndrome","step":"Recognize Cues","type":"sata","stem":"A client reports trouble sleeping because of a creepy-crawly feeling in both legs. Which findings support a diagnosis of restless legs syndrome? Select all that apply.","options":[{"t":"The bed partner reports the client's legs jerk during sleep","c":true,"r":"Periodic limb movements during sleep are common, and diagnosis relies on history and the bed partner's report."},{"t":"The sensations improve when the client sits still and rests","c":false,"r":"Rest and inactivity make RLS worse."},{"t":"The sensations are worse in the evening and at night","c":true,"r":"Symptoms worsen in the evening or at night."},{"t":"Walking or stretching temporarily relieves the sensations","c":true,"r":"Movement relieves the urge as long as the activity continues."},{"t":"Calf pain when walking that goes away with rest","c":false,"r":"This is intermittent claudication from peripheral artery disease."},{"t":"History of iron deficiency anemia","c":true,"r":"Iron deficiency is a cause of secondary RLS."},{"t":"Receives hemodialysis for ESRD","c":true,"r":"Renal disease and hemodialysis are common secondary causes."}],"takeaway":"RLS may involve impaired dopamine transmission. Secondary causes: iron deficiency, renal disease, hemodialysis, neuropathy, late pregnancy. Diagnosis: history, bed partner report, sleep diary.","fixed":false},{"id":"E14","cat":"Eye","sub":"Refractive Errors","step":"Analyze Cues","type":"mc","stem":"A 47-year-old says, “I have to hold my phone at arm's length to read it, but road signs are clear.” The nurse recognizes this as which condition?","options":[{"t":"Astigmatism","c":false,"r":"An unevenly curved cornea or lens blurs vision at all distances."},{"t":"Myopia","c":false,"r":"Nearsightedness focuses light in front of the retina, so distant objects are blurry."},{"t":"Presbyopia","c":true,"r":"Age-related loss of lens flexibility, usually starting around 45, reduces near focus."},{"t":"Hyperopia","c":false,"r":"Farsightedness also blurs near objects, but it comes from light focusing behind the retina because of eye shape and is usually present earlier in life. New near-vision trouble in the mid-40s points to presbyopia."}],"takeaway":"Refractive errors are the most common vision problem. Treatments: eyeglasses (simplest and safest), contact lenses, LASIK or PRK, lens implants.","fixed":false},{"id":"G08","cat":"Genitourinary","sub":"Genitourinary Tuberculosis","step":"Analyze Cues","type":"mc","stem":"A client with a history of pulmonary tuberculosis reports dysuria and frequency. The urinalysis shows pyuria, but routine urine cultures are repeatedly negative. Which diagnostic test should the nurse anticipate?","options":[{"t":"Three consecutive first-morning urine specimens for acid-fast bacilli","c":true,"r":"Pyuria with negative routine cultures (sterile pyuria) in a client with a TB history suggests genitourinary TB. Diagnosis is based on finding M. tuberculosis in the urine; early-morning specimens on consecutive days improve detection."},{"t":"24-hour urine collection for creatinine clearance","c":false,"r":"This measures GFR. It doesn't identify an infection."},{"t":"Serum PSA level","c":false,"r":"PSA screens for prostate disease."},{"t":"Repeat clean-catch culture in 6 weeks","c":false,"r":"Waiting allows ongoing damage and scarring."}],"takeaway":"GU TB is the second most common extrapulmonary TB. Think sterile pyuria. The long-term complication is scarring with ureteral strictures.","fixed":false},{"id":"R08","cat":"Renal","sub":"Chronic Kidney Disease","step":"Analyze Cues","type":"sata","stem":"The nurse is teaching a group of clients with ESRD about nutrition on dialysis. Which statements should the nurse include? Select all that apply.","options":[{"t":"Weight gain between hemodialysis sessions should be no more than 1 to 2 kg.","c":true,"r":"Larger gains between sessions mean fluid overload and strain on the heart."},{"t":"Clients on peritoneal dialysis may need extra potassium because it is lost in the dialysate.","c":true,"r":"PD removes potassium continuously, so some clients actually need replacement."},{"t":"Sodium restriction is common for all clients with CKD.","c":true,"r":"Limiting sodium helps control thirst, BP, and fluid gain regardless of dialysis type."},{"t":"Clients on hemodialysis need to limit potassium- and phosphate-rich foods.","c":true,"r":"HD is intermittent, so potassium and phosphorus build up between treatments. HD clients have a more restrictive diet."},{"t":"Protein is routinely restricted once dialysis begins.","c":false,"r":"Protein is not routinely restricted on dialysis; PD in particular causes protein loss into the dialysate."},{"t":"Clients on peritoneal dialysis have a more restrictive diet than clients on hemodialysis.","c":false,"r":"It's the opposite. PD runs continuously, so fluid and potassium are usually less restricted."}],"takeaway":"Hemodialysis = stricter (fluid, potassium, phosphorus). Peritoneal dialysis = more liberal and may need potassium and protein replacement.","fixed":false},{"id":"N01","cat":"Neurological","sub":"Chronic Stroke","step":"Analyze Cues","type":"sata","stem":"A client is 3 months out from a right-hemisphere ischemic stroke. Which findings would the nurse expect? Select all that apply.","options":[{"t":"Right-sided hemiparesis","c":false,"r":"Right-sided weakness results from a left-hemisphere stroke."},{"t":"Ignores food on the left side of the tray","c":true,"r":"Left neglect is common after a right-brain stroke."},{"t":"Expressive aphasia","c":false,"r":"Language centers are usually in the left hemisphere, so aphasia goes with left-brain stroke."},{"t":"Slow, cautious behavior with frequent requests for reassurance","c":false,"r":"This is characteristic of left-brain stroke."},{"t":"Trouble judging distances","c":true,"r":"Spatial-perceptual deficits are typical of right-brain stroke."},{"t":"Tries to get out of bed alone despite weakness","c":true,"r":"Right-brain stroke causes impulsivity and poor awareness of deficits, which raises fall risk."},{"t":"Left-sided weakness","c":true,"r":"Motor deficits occur on the side opposite the brain lesion."}],"takeaway":"Right brain: left weakness, neglect, impulsive, spatial problems, so focus on safety. Left brain: right weakness, aphasia, slow and cautious, so give encouragement and positive feedback.","fixed":false},{"id":"F01","cat":"Reproductive","sub":"Breast Cancer","step":"Recognize Cues","type":"sata","stem":"The nurse is reviewing health histories at a women's clinic. Which clients have risk factors for breast cancer? Select all that apply.","options":[{"t":"A 64-year-old with no family history of cancer","c":true,"r":"Age 60 or older is a major risk factor. Most women who develop breast cancer have no identifiable risk factor other than sex and age."},{"t":"A 55-year-old who drinks 3 glasses of wine daily and gained 30 lb as an adult","c":true,"r":"Alcohol intake and adult weight gain are modifiable risk factors."},{"t":"A 52-year-old who went through menopause at age 45","c":false,"r":"Early menopause shortens estrogen exposure. Late menopause is the risk factor."},{"t":"A 45-year-old who started menstruating at age 10","c":true,"r":"Early menarche (before 12) increases lifetime estrogen exposure."},{"t":"A 35-year-old whose mother had bilateral breast cancer before menopause","c":true,"r":"A first-degree relative with premenopausal or bilateral breast cancer roughly doubles risk and raises suspicion for a BRCA mutation."},{"t":"A 50-year-old with a personal history of ovarian cancer","c":true,"r":"A history of ovarian cancer is linked to shared genetic risk such as BRCA mutations."},{"t":"A 30-year-old who stopped oral contraceptives 15 years ago","c":false,"r":"Remote oral contraceptive use is not a meaningful risk factor."}],"takeaway":"Non-modifiable: female, age, family history or BRCA, early menarche, late menopause. Modifiable: alcohol, adult weight gain, obesity, inactivity, smoking, dietary fat, radiation.","fixed":false},{"id":"A03","cat":"Ear","sub":"External Otitis","step":"Generate Solutions","type":"sata","stem":"A client who swims daily is diagnosed with external otitis. Which instructions should the nurse include? Select all that apply.","options":[{"t":"Pain when chewing means the infection has spread to the jaw, so go to the ED.","c":false,"r":"Pain with chewing, pinna movement, or tragus pressure is expected with external otitis."},{"t":"Keep water out of the ear until it heals.","c":true,"r":"Moisture changes the canal's normal flora and promotes infection."},{"t":"Don't clean your ears with cotton-tipped swabs.","c":true,"r":"Swabs injure the canal skin and push debris deeper."},{"t":"After putting in the drops, stay in position for 3 to 5 minutes.","c":true,"r":"This gives the medication time to coat the canal."},{"t":"Go back to swimming as soon as the pain starts to ease.","c":false,"r":"Returning to the water before healing invites reinfection."},{"t":"Call if your symptoms aren't improving within 48 hours.","c":true,"r":"Improvement is expected within 48 hours of treatment."}],"takeaway":"Swimmer's ear is usually Pseudomonas or S. aureus (fungal: Candida, Aspergillus). Treatment: topical antibiotic and corticosteroid drops, moist heat, analgesics.","fixed":false},{"id":"G12","cat":"Genitourinary","sub":"Urinary Incontinence","step":"Generate Solutions","type":"sata","stem":"A client is diagnosed with urge incontinence (overactive bladder). Which interventions should the nurse anticipate? Select all that apply.","options":[{"t":"Mirabegron or an anticholinergic medication","c":true,"r":"These relax the overactive detrusor muscle."},{"t":"Limiting caffeine and alcohol","c":true,"r":"Both irritate the bladder and increase urgency."},{"t":"Intermittent self-catheterization every 4 to 6 hours","c":false,"r":"This is used for overflow incontinence, when the bladder can't empty."},{"t":"Bladder training with gradually longer intervals between voids","c":true,"r":"Retrains the bladder to hold more urine and reduces urgency."},{"t":"Restricting fluids to 800 mL per day","c":false,"r":"Concentrated urine irritates the bladder and increases urgency."},{"t":"Bethanechol to increase bladder contractions","c":false,"r":"This would worsen an already overactive detrusor."},{"t":"Pelvic floor (Kegel) exercises","c":true,"r":"Strong pelvic floor muscles help suppress urgency contractions."}],"takeaway":"Urge incontinence: anticholinergics or mirabegron, bladder training, Kegels, avoid irritants, external catheters if needed.","fixed":false},{"id":"F11","cat":"Reproductive","sub":"Cervical Cancer","step":"Generate Solutions","type":"sata","stem":"The nurse is teaching at a community health event about cervical cancer prevention. Which information should the nurse include? Select all that apply.","options":[{"t":"The HPV vaccine is only needed for females.","c":false,"r":"Males are vaccinated too, to prevent HPV-related cancers and transmission."},{"t":"The HPV vaccine is recommended for both boys and girls at age 11 to 12.","c":true,"r":"Persistent infection with high-risk HPV types 16 and 18 causes most cervical cancers."},{"t":"Pap testing should begin within 1 year of first sexual activity, regardless of age.","c":false,"r":"Screening starts at age 21 regardless of sexual history."},{"t":"Women age 21 to 29 should have a Pap test every 3 years.","c":true,"r":"This is the recommended interval for this age group."},{"t":"Women age 30 to 65 should have a Pap test plus HPV testing every 5 years.","c":true,"r":"Co-testing allows a longer interval."},{"t":"Quitting smoking lowers risk.","c":true,"r":"Smoking is a cervical cancer risk factor."},{"t":"Early cervical cancer causes heavy bleeding and pain, so symptoms will alert you.","c":false,"r":"Early cervical cancer usually has no symptoms, which is why screening matters."}],"takeaway":"Cervical cancer risk: HPV 16 and 18, smoking, long-term oral contraceptive use, DES exposure, multiparity. Late signs: watery discharge becoming dark and foul, heavier spotting, pain, weight loss, anemia.","fixed":false},{"id":"F16","cat":"Reproductive","sub":"Benign Prostatic Hyperplasia","step":"Generate Solutions","type":"sata","stem":"A client with BPH is prescribed tamsulosin and finasteride. Which instructions should the nurse include? Select all that apply.","options":[{"t":"Pregnant women can safely handle crushed finasteride tablets.","c":false,"r":"Finasteride can cause birth defects in a male fetus. Pregnant women should not handle crushed or broken tablets."},{"t":"Limit alcohol and caffeine, especially in the evening.","c":true,"r":"Their diuretic effect causes bladder distention and overactivity."},{"t":"Void every 2 to 3 hours and as soon as you feel the urge.","c":true,"r":"Avoids overdistention of the bladder."},{"t":"Change positions slowly, especially when getting out of bed.","c":true,"r":"Alpha blockers relax smooth muscle in blood vessels and can cause orthostatic hypotension."},{"t":"Avoid over-the-counter decongestants such as pseudoephedrine.","c":true,"r":"Adrenergic agonists contract prostatic smooth muscle and can cause acute urinary retention."},{"t":"Finasteride will relieve your symptoms within a few days.","c":false,"r":"5-alpha reductase inhibitors shrink the prostate slowly; full benefit can take up to 6 months."}],"takeaway":"BPH: nocturia is often the first symptom. Irritative (frequency, urgency) and obstructive (weak stream, hesitancy, dribbling) symptoms. Complications: UTI, pyelonephritis, sepsis, bladder stones.","fixed":false},{"id":"R04","cat":"Renal","sub":"Chronic Kidney Disease","step":"Analyze Cues","type":"sata","stem":"A client with stage 4 CKD has routine labs drawn. Which results would the nurse expect as a direct result of the disease process? Select all that apply.","options":[{"t":"Arterial pH 7.49","c":false,"r":"CKD causes metabolic acidosis (low pH), not alkalosis."},{"t":"Bicarbonate 17 mEq/L","c":true,"r":"Metabolic acidosis results from impaired acid excretion and poor bicarbonate reabsorption."},{"t":"Potassium 5.8 mEq/L","c":true,"r":"Potassium is excreted mainly by the kidneys. As output and function fall, hyperkalemia develops."},{"t":"Calcium 7.9 mg/dL","c":true,"r":"The kidneys can't activate vitamin D, so less calcium is absorbed. High phosphorus also binds calcium. Both cause hypocalcemia."},{"t":"Parathyroid hormone below normal","c":false,"r":"Low calcium and high phosphorus stimulate the parathyroid glands, so PTH rises (secondary hyperparathyroidism), pulling calcium from bone."},{"t":"Hemoglobin 15.2 g/dL","c":false,"r":"Anemia is expected because the kidneys make less erythropoietin. A normal or high hemoglobin is not expected."},{"t":"Phosphorus 6.0 mg/dL","c":true,"r":"The failing kidneys can't excrete phosphate, causing hyperphosphatemia."}],"takeaway":"CKD labs: K up, phosphorus up, calcium down, HCO3 down (acidosis), Hgb down, PTH up, BUN and creatinine up.","fixed":false},{"id":"N03","cat":"Neurological","sub":"Chronic Stroke","step":"Take Action","type":"sata","stem":"A client with a chronic stroke has right hemiparesis and dysphagia. Which actions should the nurse take? Select all that apply.","options":[{"t":"Place food in the back of the mouth on the unaffected (left) side.","c":true,"r":"The unaffected side has better sensation and muscle control."},{"t":"Turn off the TV and limit distractions during meals.","c":true,"r":"A calm, distraction-free environment lets the client focus on swallowing."},{"t":"Lay the client flat right after eating so they can rest.","c":false,"r":"Clients should stay upright for 30 to 60 minutes after meals."},{"t":"Offer thin liquids through a straw to make swallowing easier.","c":false,"r":"Thin liquids and straws increase aspiration risk; thickened liquids are often prescribed."},{"t":"Position the client upright at 90 degrees for meals.","c":true,"r":"Upright positioning uses gravity to reduce aspiration."},{"t":"Pull the client up in bed using the affected arm.","c":false,"r":"Pulling on the affected arm can cause subluxation and pain."},{"t":"Support the affected arm on a pillow or armrest.","c":true,"r":"Supporting the flaccid arm prevents shoulder subluxation."}],"takeaway":"Chronic stroke safety: aspiration precautions, fall prevention, ROM and support of the affected limb, skin protection, bowel and bladder retraining, and rehab referrals (PT, OT, speech).","fixed":false},{"id":"N16","cat":"Neurological","sub":"Myasthenia Gravis","step":"Recognize Cues","type":"sata","stem":"Which assessment findings are consistent with myasthenia gravis? Select all that apply.","options":[{"t":"Weakness that is worse at the end of the day","c":true,"r":"Weakness worsens with activity."},{"t":"Numbness and tingling in the hands and feet","c":false,"r":"MG affects the neuromuscular junction only; sensation is normal."},{"t":"Strength improves after a period of rest","c":true,"r":"Rest lets acetylcholine receptors recover."},{"t":"Drooping eyelids that worsen during prolonged upward gaze","c":true,"r":"Ptosis with fatigability on sustained upward gaze (2 to 3 minutes) is a classic exam finding."},{"t":"Double vision","c":true,"r":"Eye muscles are often affected first."},{"t":"Muscle twitching and wasting","c":false,"r":"Fasciculations and atrophy are lower motor neuron signs, as seen in ALS."}],"takeaway":"MG: autoimmune attack on acetylcholine receptors. Often begins before 40 in women and after 60 in men. Diagnosis: AChR antibodies, single-fiber EMG, edrophonium test, chest CT for thymus.","fixed":false},{"id":"R16","cat":"Renal","sub":"Effects of Aging","step":"Analyze Cues","type":"mc","stem":"The nurse is assessing an 82-year-old client. Which finding is consistent with expected age-related changes of the renal and urinary system?","options":[{"t":"Urine output of 200 mL in 24 hours","c":false,"r":"This is oliguria and suggests acute kidney injury or obstruction."},{"t":"Proteinuria of 2+ on repeated dipstick tests","c":false,"r":"Persistent proteinuria means kidney damage and is never normal aging."},{"t":"Visible blood in the urine","c":false,"r":"Hematuria needs evaluation for infection, stones, or bladder cancer."},{"t":"Nocturia and less concentrated urine","c":true,"r":"Aging reduces nephrons and tubular function, so the kidneys concentrate urine less effectively, leading to nocturia."}],"takeaway":"Normal aging: fewer nephrons, lower creatinine clearance, nocturia, frequency, less bladder elasticity. Proteinuria, hematuria, and oliguria are never normal.","fixed":false},{"id":"F17","cat":"Reproductive","sub":"Prostate Cancer","step":"Generate Solutions","type":"mc","stem":"A 46-year-old Black man whose father was diagnosed with prostate cancer at age 60 asks when he should start thinking about screening. Which response by the nurse is most accurate?","options":[{"t":"“Now. Because of your race and your father's diagnosis before 65, the discussion is recommended starting at 45.”","c":true,"r":"ACS: discuss screening at 50 for average risk with at least a 10-year life expectancy, 45 for high risk (Black men, a first-degree relative diagnosed before 65), and 40 for higher risk (more than one first-degree relative diagnosed early)."},{"t":"“At 50, the same age as everyone else.”","c":false,"r":"Age 50 applies to men at average risk."},{"t":"“Only if you start having urinary symptoms.”","c":false,"r":"Early prostate cancer is usually asymptomatic. Most men are diagnosed through PSA screening."},{"t":"“At 55, when routine screening starts.”","c":false,"r":"Screening every 2 years from 55 to 69 applies to average-risk men; this client is high risk."}],"takeaway":"Prostate cancer is the most common cancer in men (excluding skin). Risk: age, Black race, family history, diets high in red meat and high-fat dairy, obesity.","fixed":false},{"id":"E13","cat":"Eye","sub":"Corneal Ulcer and Infection","step":"Take Action","type":"sata","stem":"A client who sleeps in extended-wear contact lenses is diagnosed with a bacterial corneal ulcer. Which actions should the nurse take? Select all that apply.","options":[{"t":"Apply a tight pressure patch over the eye.","c":false,"r":"Patching an infected eye creates a warm, dark environment for bacteria to grow."},{"t":"Teach the client to report increased pain or decreased vision.","c":true,"r":"Untreated ulcers can scar or perforate the cornea and may require a transplant."},{"t":"Teach the client to rinse lenses with tap water.","c":false,"r":"Tap water can carry Acanthamoeba and other organisms."},{"t":"Explain that fluorescein dye will be used to outline the corneal defect.","c":true,"r":"Fluorescein stains damaged corneal epithelium so it glows under blue light. It's also how corneal abrasions are found."},{"t":"Give antibiotic eye drops every hour, including overnight, for the first 24 hours.","c":true,"r":"Treatment is aggressive to prevent permanent vision loss."},{"t":"Tell the client not to wear contact lenses until cleared by the provider.","c":true,"r":"Lenses trap bacteria against the injured cornea."}],"takeaway":"Corneal ulcer: pain, tearing, redness, drainage, photophobia, foreign body feeling. Antimicrobial drops every hour for the first 24 hours.","fixed":false},{"id":"E07","cat":"Eye","sub":"Ophthalmic Medications","step":"Take Action","type":"mc","stem":"A client with COPD has a resting heart rate of 52 beats/min. The provider prescribes timolol eye drops for glaucoma. Which action should the nurse take?","options":[{"t":"Give the drops without applying pressure to the inner canthus.","c":false,"r":"Skipping punctal occlusion increases systemic absorption."},{"t":"Give the drops and recheck the heart rate tomorrow.","c":false,"r":"Giving the drug first risks worsening bradycardia and bronchospasm."},{"t":"Ask the client about use of corrective lenses.","c":false,"r":"This doesn't address the safety concern."},{"t":"Contact the provider to clarify the prescription before giving it.","c":true,"r":"Topical beta-blockers are absorbed systemically and can cause bradycardia, heart block, and bronchospasm."}],"takeaway":"Before glaucoma drops, ask about heart and lung disease and any other beta-blockers the client takes.","fixed":false},{"id":"F04","cat":"Reproductive","sub":"Fibrocystic Breast Condition","step":"Analyze Cues","type":"mc","stem":"A 34-year-old reports bilateral breast tenderness and lumpiness that worsens the week before her period. Aspiration of one lump yields clear fluid. Which statement by the nurse is accurate?","options":[{"t":"“Clear fluid means the lump is cancer and needs a mastectomy.”","c":false,"r":"Clear fluid supports a benign cyst. Bloody fluid would be sent for cytology."},{"t":"“This is a fibroadenoma that must be removed surgically.”","c":false,"r":"Fibroadenomas are usually single, nontender, and not cyclic."},{"t":"“This fits fibrocystic breast condition, an exaggerated response to estrogen and progesterone. It isn't linked to a higher breast cancer risk.”","c":true,"r":"FBC causes cyst formation and excess fibrous tissue that change with the menstrual cycle, most commonly in women 30 to 50."},{"t":"“The lumps come from milk ducts blocked during past breastfeeding.”","c":false,"r":"FBC is hormonal, not caused by prior breastfeeding."}],"takeaway":"FBC: ages 30 to 50, bilateral, tender, cyclic with menses, not linked to cancer risk.","fixed":false},{"id":"G11","cat":"Genitourinary","sub":"Urinary Incontinence","step":"Take Action","type":"mc","stem":"A client with a neurogenic bladder from multiple sclerosis has overflow incontinence. Which medication should the nurse anticipate?","options":[{"t":"Mirabegron","c":false,"r":"A beta-3 agonist that relaxes the bladder for overactive bladder (urge incontinence)."},{"t":"Bethanechol","c":true,"r":"A cholinergic drug that strengthens detrusor contraction to help the bladder empty."},{"t":"Topical vaginal estrogen","c":false,"r":"Used for stress incontinence to improve tissue tone."},{"t":"Oxybutynin","c":false,"r":"An anticholinergic used for urge incontinence. It relaxes the detrusor and would worsen retention."}],"takeaway":"Overflow = the bladder can't empty: intermittent catheterization, bethanechol, a pessary for prolapse, or surgery to fix an obstruction.","fixed":false},{"id":"E12","cat":"Eye","sub":"Keratitis","step":"Take Action","type":"mc","stem":"A client has herpes simplex keratitis with a branching (dendritic) corneal ulcer. Which prescription should the nurse question?","options":[{"t":"Trifluridine eye drops","c":false,"r":"A topical antiviral used to treat HSV keratitis."},{"t":"Ganciclovir ophthalmic gel","c":false,"r":"A topical antiviral used to treat HSV keratitis."},{"t":"Oral acyclovir","c":false,"r":"Systemic antivirals are used for HSV keratitis."},{"t":"Prednisolone acetate eye drops","c":true,"r":"Corticosteroid drops can worsen HSV keratitis, deepening the ulcer and risking perforation."}],"takeaway":"HSV keratitis = tree-branching ulcer, treated with antivirals. Bacterial keratitis is linked to contact lens wear and treated with antibiotics. Pain and photophobia are common.","fixed":false},{"id":"R12","cat":"Renal","sub":"Chronic Kidney Disease","step":"Recognize Cues","type":"sata","stem":"The nurse is identifying clients who should be screened for chronic kidney disease. Which clients are at increased risk? Select all that apply.","options":[{"t":"A 52-year-old with type 2 diabetes","c":true,"r":"Diabetes is the leading cause, responsible for about 50% of CKD."},{"t":"A 38-year-old with a history of pancreatitis","c":false,"r":"Pancreatitis is not a recognized risk factor for CKD."},{"t":"A 50-year-old who takes NSAIDs daily for chronic back pain","c":true,"r":"Long-term exposure to nephrotoxic drugs increases risk."},{"t":"A 30-year-old with well-controlled asthma","c":false,"r":"Asthma does not increase CKD risk."},{"t":"A 45-year-old with a 10-year history of hypertension","c":true,"r":"Hypertension causes about 25% of CKD."},{"t":"A 64-year-old Black man","c":true,"r":"Age over 60 and belonging to certain groups (Black, Native American) increase CKD risk."}],"takeaway":"CKD risk: diabetes, hypertension, age over 60, cardiovascular disease, family history, Black or Native American ethnicity, nephrotoxic drugs. About 70% of people with CKD don't know they have it.","fixed":false},{"id":"P05","cat":"Pediatric GU","sub":"Cryptorchidism","step":"Analyze Cues","type":"mc","stem":"A father asks why surgery is recommended for his 18-month-old son's undescended testis. Which response by the nurse is most accurate?","options":[{"t":"“Undescended testes usually cause severe pain in toddlers.”","c":false,"r":"Cryptorchidism is usually painless. Sudden pain would suggest torsion."},{"t":"“A testis that stays inside the body is exposed to body heat, which can lower sperm counts later. It also has a higher risk of torsion, injury, and testicular cancer.”","c":true,"r":"Body heat damages sperm-producing cells. hCG may be tried first to induce descent; if the testis stays undescended, an orchiopexy is done in the toddler years."},{"t":"“Surgery is needed before he can be toilet trained.”","c":false,"r":"Cryptorchidism doesn't affect toilet training."},{"t":"“It prevents hypospadias from developing.”","c":false,"r":"Hypospadias is a separate congenital defect present at birth."}],"takeaway":"Cryptorchidism: risk for low sperm count, torsion, trauma, inguinal hernia, and later testicular cancer. Treatment: hCG, then orchiopexy.","fixed":false},{"id":"G03","cat":"Genitourinary","sub":"UTI Diagnostics","step":"Take Action","type":"mc","stem":"A client with suspected pyelonephritis has these prescriptions: IV ciprofloxacin, urine culture and sensitivity, acetaminophen PRN for a temperature of 100.8°F (38.2°C), and a renal ultrasound. Which prescription should the nurse carry out first?","options":[{"t":"Schedule the renal ultrasound","c":false,"r":"Imaging is used when obstruction is suspected and isn't the first step."},{"t":"Give acetaminophen for the low-grade fever","c":false,"r":"Comfort for a low-grade fever is less urgent than getting an accurate culture and starting antibiotics."},{"t":"Give the IV ciprofloxacin","c":false,"r":"Antibiotics are a priority, but they come right after the culture is collected."},{"t":"Collect the urine specimen for culture and sensitivity","c":true,"r":"Cultures must be collected before the first antibiotic dose; otherwise the organism may not grow and therapy can't be targeted."}],"takeaway":"Culture first, then antibiotics. Uncomplicated UTI: about 3 days of therapy. Complicated: fluoroquinolones for 7 to 14 days or longer.","fixed":false},{"id":"G14","cat":"Genitourinary","sub":"Urethritis","step":"Analyze Cues","type":"mc","stem":"A 24-year-old man reports burning with urination and a purulent discharge from the urethra. Routine urine culture is negative for common urinary pathogens. Which action should the nurse anticipate?","options":[{"t":"Testing for gonorrhea and chlamydia and treatment of sexual partners","c":true,"r":"Urethritis in sexually active adults is often caused by STIs. Partners must be treated to prevent reinfection."},{"t":"Continuous bladder irrigation","c":false,"r":"CBI is used after a TURP."},{"t":"A 14-day course of IV fluoroquinolones","c":false,"r":"That regimen is for complicated pyelonephritis."},{"t":"Cystoscopy to look for a bladder tumor","c":false,"r":"Painless hematuria, not urethral discharge, raises concern for bladder cancer."}],"takeaway":"Urethritis: dysuria and discharge. Think STI, test and treat partners, teach condom use.","fixed":false},{"id":"F21","cat":"Reproductive","sub":"Gender-Affirming Hormone Therapy","step":"Generate Solutions","type":"sata","stem":"A transgender woman is receiving feminizing hormone therapy with estradiol and spironolactone. Which actions should the nurse include in her care? Select all that apply.","options":[{"t":"Monitor serum potassium.","c":true,"r":"Spironolactone is a potassium-sparing diuretic used as an antiandrogen, so hyperkalemia is a risk."},{"t":"Teach that this therapy will have no effect on fertility.","c":false,"r":"Feminizing therapy can reduce sperm production. Fertility preservation should be discussed before starting."},{"t":"Assess for signs of deep vein thrombosis, such as calf swelling and pain.","c":true,"r":"Estrogen increases clotting risk, especially in people who smoke."},{"t":"Use the client's chosen name and pronouns.","c":true,"r":"Respecting identity builds trust and supports ongoing preventive care."},{"t":"Monitor estradiol and testosterone levels as scheduled.","c":true,"r":"Hormone levels guide dosing and confirm therapy is in the target range."},{"t":"Monitor hematocrit for erythrocytosis as the main lab concern.","c":false,"r":"Rising hematocrit (erythrocytosis) is the key concern with masculinizing testosterone therapy, not estrogen."}],"takeaway":"Feminizing (estrogen + antiandrogen): monitor potassium, hormone levels, VTE signs, lipids, liver function. Masculinizing (testosterone): monitor hematocrit and hemoglobin, lipids, liver function, hormone levels.","fixed":false},{"id":"R06","cat":"Renal","sub":"Chronic Kidney Disease","step":"Generate Solutions","type":"sata","stem":"A client with stage 4 CKD who is not on dialysis has a potassium level of 5.4 mEq/L. Which dietary instructions should the nurse include? Select all that apply.","options":[{"t":"Use a salt substitute to season foods.","c":false,"r":"Most salt substitutes are potassium chloride and can worsen hyperkalemia."},{"t":"Avoid high-protein diets and protein supplements.","c":true,"r":"Excess protein overworks damaged kidneys and raises BUN. In stages 1 to 4, a normal protein intake is encouraged, not a high one."},{"t":"Limit foods such as bananas, oranges, potatoes, and tomatoes.","c":true,"r":"These foods are high in potassium. Limiting them is appropriate when potassium is elevated."},{"t":"Eliminate protein from your diet to rest the kidneys.","c":false,"r":"Severe protein restriction causes malnutrition and low albumin, which predicts a poor prognosis in CKD."},{"t":"Restrict fluids to 1,000 mL per day.","c":false,"r":"Fluids are not routinely restricted before stage 5 unless there is fluid overload."},{"t":"Meet with a dietitian to build an individualized meal plan.","c":true,"r":"Every client with CKD benefits from dietitian teaching that considers cultural food preferences."},{"t":"Limit sodium intake.","c":true,"r":"Sodium restriction helps control BP and fluid retention and is common for all clients with CKD."}],"takeaway":"Before dialysis: limit sodium, potassium (when high), and phosphorus. Keep protein normal, not high and not eliminated. Fluids usually aren't restricted until stage 5.","fixed":false},{"id":"F02","cat":"Reproductive","sub":"Breast Cancer Screening","step":"Generate Solutions","type":"mc","stem":"A 57-year-old woman at average risk for breast cancer asks about screening. Based on American Cancer Society guidelines, what should the nurse tell her?","options":[{"t":"“You should have an annual breast MRI.”","c":false,"r":"MRI is added for high-risk women, such as those with BRCA mutations or prior chest radiation."},{"t":"“Have a mammogram every 2 years, or yearly if you prefer, as long as you're in good health.”","c":true,"r":"Average risk: option to start at 40, yearly from 45 to 54, then every 2 years (or yearly) from 55 on."},{"t":"“You need a yearly clinical breast exam by your provider.”","c":false,"r":"The ACS does not recommend clinical breast exams for average-risk women at any age."},{"t":"“You can stop mammograms now that you're over 55.”","c":false,"r":"Screening continues as long as overall health is good and life expectancy is at least 10 years."}],"takeaway":"Average-risk mammograms: optional at 40 to 44, yearly at 45 to 54, every 2 years (or yearly) at 55 and older. High risk: earlier 3D mammography, MRI, more frequent CBE.","fixed":false}]</script>
<script>
(function(){
"use strict";
var QUESTIONS = JSON.parse(document.getElementById("qdata").textContent);
var QMAP = {}; QUESTIONS.forEach(function(q, i){ q.num = i + 1; QMAP[q.id] = q; });
var CATS = []; QUESTIONS.forEach(function(q){ if (CATS.indexOf(q.cat) < 0) CATS.push(q.cat); });
var STEPS = ["Recognize Cues","Analyze Cues","Prioritize Hypotheses","Generate Solutions","Take Action","Evaluate Outcomes"];
var L = "ABCDEFGH";
var K = { session:"m2ngn.session.v1", last:"m2ngn.last.v1", history:"m2ngn.history.v1", missed:"m2ngn.missed.v1", flags:"m2ngn.flags.v1", prefs:"m2ngn.prefs.v1" };
var store = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
};
var ICON = {
  flag:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 14.5v-12"/><path d="M3.5 2.5h8l-1.8 3 1.8 3h-8"/></svg>',
  strike:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M3.8 12.2l8.4-8.4"/></svg>',
  left:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>',
  right:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>',
  grid:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>',
  check:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>',
  x:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>',
  half:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h6"/></svg>'
};

var prefs = Object.assign({ pCats: CATS.slice(), pType:"all", pCount:"25", pSource:"all", pShuffle:true, pShuffleOpts:false, eTime:"120", eShuffle:true, eShuffleOpts:false }, store.get(K.prefs, {}));
prefs.pCats = (prefs.pCats || []).filter(function(c){ return CATS.indexOf(c) >= 0; });

var hot = (window.claude && window.claude.hot && window.claude.hot.data) || null;
var state = {
  view: (hot && hot.view) || "home",
  session: (hot && hot.session) || store.get(K.session, null),
  last: store.get(K.last, null),
  navOpen: false, modal: null, review: null, rFilter: "all",
  keyCat: "all", keyQ: "", homeErr: "", toast: ""
};
if (state.view !== "home" && !state.session) state.view = "home";
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(function(){ return { view: state.view === "test" ? "test" : "home", session: state.session }; }); } catch(e){}
}

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmt(sec){ sec = Math.max(0, Math.round(sec)); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ":" + String(m).padStart(2,"0") : String(m)) + ":" + String(s).padStart(2,"0"); }
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }
function save(){ if (state.session) store.set(K.session, state.session); }
function savePrefs(){ store.set(K.prefs, prefs); }
function correctIdx(q){ var r = []; q.options.forEach(function(o, i){ if (o.c) r.push(i); }); return r; }
function scoreQ(q, sel){
  sel = sel || [];
  if (q.type === "mc"){ var ok = sel.length === 1 && q.options[sel[0]].c; return { pts: ok ? 1 : 0, max: 1, exact: ok }; }
  var pts = 0; sel.forEach(function(i){ pts += q.options[i].c ? 1 : -1; });
  var need = correctIdx(q);
  var exact = sel.length === need.length && sel.every(function(i){ return q.options[i].c; });
  return { pts: Math.max(0, pts), max: need.length, exact: exact };
}
function globalFlags(){ return store.get(K.flags, []); }
function setGlobalFlag(id, on){ var f = globalFlags().filter(function(x){ return x !== id; }); if (on) f.push(id); store.set(K.flags, f); }
function isAnswered(s, id){ return s.mode === "practice" ? !!s.submitted[id] : ((s.answers[id] || []).length > 0); }
function curQ(){ var s = state.session; return QMAP[s.qids[s.cur]]; }
function toast(msg){ state.toast = msg; renderToast(); clearTimeout(toast._t); toast._t = setTimeout(function(){ state.toast = ""; renderToast(); }, 2200); }

/* ---------- session ---------- */
function buildSession(mode){
  var pool = QUESTIONS.slice();
  var shuffleOpts;
  if (mode === "practice"){
    pool = pool.filter(function(q){ return prefs.pCats.indexOf(q.cat) >= 0; });
    if (prefs.pType !== "all") pool = pool.filter(function(q){ return q.type === prefs.pType; });
    if (prefs.pSource === "missed"){ var m = store.get(K.missed, []); pool = pool.filter(function(q){ return m.indexOf(q.id) >= 0; }); }
    if (prefs.pSource === "flagged"){ var f = globalFlags(); pool = pool.filter(function(q){ return f.indexOf(q.id) >= 0; }); }
    if (prefs.pShuffle) shuffle(pool);
    if (prefs.pCount !== "all") pool = pool.slice(0, parseInt(prefs.pCount, 10));
    shuffleOpts = prefs.pShuffleOpts;
  } else {
    if (prefs.eShuffle) shuffle(pool);
    shuffleOpts = prefs.eShuffleOpts;
  }
  if (!pool.length) return null;
  var optOrder = {};
  pool.forEach(function(q){ var idx = q.options.map(function(_, i){ return i; }); if (shuffleOpts && !q.fixed) shuffle(idx); optOrder[q.id] = idx; });
  var gf = globalFlags(), flagged = {};
  pool.forEach(function(q){ if (gf.indexOf(q.id) >= 0) flagged[q.id] = true; });
  return { id: Date.now().toString(36), mode: mode, qids: pool.map(function(q){ return q.id; }), optOrder: optOrder,
    answers:{}, submitted:{}, flagged: flagged, struck:{}, visited:{}, cur:0, elapsed:0, paused:false,
    timeLimit: mode === "exam" && prefs.eTime !== "0" ? parseInt(prefs.eTime, 10) * 60 : 0,
    startedAt: Date.now(), finished:false };
}
function start(mode){
  var s = buildSession(mode);
  if (!s){ state.homeErr = prefs.pSource === "missed" ? "You don't have any missed questions saved yet. Try All questions." : prefs.pSource === "flagged" ? "You haven't flagged any questions yet." : "No questions match these settings. Pick at least one content area."; render(); return; }
  state.homeErr = ""; state.session = s; s.visited[s.qids[0]] = true; save();
  state.view = "test"; state.navOpen = false; render(); window.scrollTo(0, 0);
}
function go(i){
  var s = state.session; if (i < 0 || i >= s.qids.length) return;
  s.cur = i; s.visited[s.qids[i]] = true; state.navOpen = false; save(); render(); window.scrollTo(0, 0);
}
function pick(i){
  var s = state.session, q = curQ();
  if (s.mode === "practice" && s.submitted[q.id]) return;
  var sel = (s.answers[q.id] || []).slice();
  if (q.type === "mc") sel = sel[0] === i ? [] : [i];
  else { var at = sel.indexOf(i); if (at >= 0) sel.splice(at, 1); else sel.push(i); }
  s.answers[q.id] = sel;
  var st = s.struck[q.id] || []; if (sel.indexOf(i) >= 0 && st.indexOf(i) >= 0) s.struck[q.id] = st.filter(function(x){ return x !== i; });
  save(); render();
}
function strike(i){
  var s = state.session, q = curQ();
  if (s.mode === "practice" && s.submitted[q.id]) return;
  var st = (s.struck[q.id] || []).slice(); var at = st.indexOf(i);
  if (at >= 0) st.splice(at, 1); else { st.push(i); s.answers[q.id] = (s.answers[q.id] || []).filter(function(x){ return x !== i; }); }
  s.struck[q.id] = st; save(); render();
}
function submitQ(){
  var s = state.session, q = curQ();
  if (!(s.answers[q.id] || []).length) return;
  s.submitted[q.id] = true;
  var r = scoreQ(q, s.answers[q.id]);
  var missed = store.get(K.missed, []).filter(function(x){ return x !== q.id; });
  if (!r.exact) missed.push(q.id);
  store.set(K.missed, missed);
  save(); render();
}
function toggleFlag(){
  var s = state.session, q = curQ(); var on = !s.flagged[q.id];
  if (on) s.flagged[q.id] = true; else delete s.flagged[q.id];
  setGlobalFlag(q.id, on); save(); render();
}
function nextOrFinish(){
  var s = state.session;
  if (s.cur < s.qids.length - 1) go(s.cur + 1); else openEnd();
}
function firstWhere(fn){ var s = state.session; for (var k = 1; k <= s.qids.length; k++){ var i = (s.cur + k) % s.qids.length; if (fn(s.qids[i], i)) return i; } return -1; }
function openEnd(){ state.modal = "end"; render(); }

function results(s){
  var rows = s.qids.map(function(id, i){
    var q = QMAP[id], sel = s.answers[id] || [], ans = isAnswered(s, id), r = scoreQ(q, sel);
    var status = !ans ? "skip" : r.exact ? "right" : r.pts > 0 ? "part" : "wrong";
    return { id:id, i:i, q:q, ans:ans, r:r, status:status, flag: !!s.flagged[id] };
  });
  var att = rows.filter(function(x){ return x.ans; });
  var denomRows = s.mode === "exam" ? rows : att;
  var exact = att.filter(function(x){ return x.r.exact; }).length;
  var pts = att.reduce(function(a, x){ return a + x.r.pts; }, 0);
  var maxPts = denomRows.reduce(function(a, x){ return a + x.r.max; }, 0);
  function group(key, keys){ return keys.map(function(k){ var rr = denomRows.filter(function(x){ return key(x) === k; }); return { k:k, n: rr.length, right: rr.filter(function(x){ return x.r.exact; }).length }; }).filter(function(g){ return g.n; }); }
  return { rows: rows, attempted: att.length, total: rows.length, denom: denomRows.length, exact: exact, pts: pts, maxPts: maxPts,
    byCat: group(function(x){ return x.q.cat; }, CATS),
    byType: group(function(x){ return x.q.type; }, ["sata","mc"]),
    byStep: group(function(x){ return x.q.step; }, STEPS) };
}
function finish(timeUp){
  var s = state.session; if (!s || s.finished) return;
  s.finished = true; s.endedAt = Date.now();
  var R = results(s);
  if (s.mode === "exam"){
    var missed = store.get(K.missed, []);
    R.rows.forEach(function(x){ missed = missed.filter(function(m){ return m !== x.id; }); if (!x.r.exact) missed.push(x.id); });
    store.set(K.missed, missed);
  }
  var hist = store.get(K.history, []);
  hist.unshift({ at: s.endedAt, mode: s.mode, total: R.total, denom: R.denom, exact: R.exact, pts: R.pts, maxPts: R.maxPts, elapsed: Math.round(s.elapsed) });
  store.set(K.history, hist.slice(0, 12));
  state.last = s; store.set(K.last, s); store.del(K.session);
  state.modal = timeUp ? "timeup" : null; state.view = "results"; state.rFilter = "all"; state.navOpen = false;
  render(); window.scrollTo(0, 0);
}

  s.elapsed += dt;
  var el = document.getElementById("timer");

    el.classList.toggle("warn", remain !== null && remain <= 300);
  }
  if (s.timeLimit && s.elapsed >= s.timeLimit) { finish(true); return; }
  if (++saveCount % 10 === 0) save();
}, 500);
