<title>Module 2 NGN Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: testing-center shell. Sticky top bar, one reading column for the item, navigator rail on wide screens, fixed action bar at the bottom. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#E3E9E7; --ink:#14232A; --ink-2:#4B5B62; --line:#CBD5D2;
  --accent:#0D5C6E; --accent-ink:#FFFFFF; --accent-soft:#D8E9ED;
  --ok:#1A7546; --ok-soft:#DCF0E3; --bad:#B0281F; --bad-soft:#F7DFDC; --flag:#A35F00; --flag-soft:#FAEAD0;
  --scrim:rgba(10,20,24,.5);
  --font-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1518; --surface:#152025; --surface-2:#1C2A30; --ink:#E3ECEA; --ink-2:#9BAEB2; --line:#2B3C42;
  --accent:#6BBACB; --accent-ink:#071114; --accent-soft:#16343D;
  --ok:#62CB91; --ok-soft:#14321F; --bad:#F2897F; --bad-soft:#3B1C1A; --flag:#EFB45A; --flag-soft:#3A2B12;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1518; --surface:#152025; --surface-2:#1C2A30; --ink:#E3ECEA; --ink-2:#9BAEB2; --line:#2B3C42;
  --accent:#6BBACB; --accent-ink:#071114; --accent-soft:#16343D;
  --ok:#62CB91; --ok-soft:#14321F; --bad:#F2897F; --bad-soft:#3B1C1A; --flag:#EFB45A; --flag-soft:#3A2B12;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 72px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:42px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.flag[aria-pressed="true"]{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn svg{width:16px;height:16px;flex:none}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}

/* ---------- HOME ---------- */
.hero{display:grid;gap:14px;padding-block:8px 28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1{font-weight:800;font-size:clamp(30px,4.6vw,48px);letter-spacing:-.025em;line-height:1.05}
.hero .sub{color:var(--ink-2);font-size:16px;max-width:62ch}
.readout{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:fit-content;max-width:100%;overflow:hidden}
.readout div{display:grid;padding:10px 16px;border-right:1px solid var(--line);min-width:0}
.readout div:last-child{border-right:0}
.readout b{font-family:var(--font-mono);font-size:22px;font-weight:600;line-height:1.1}
.readout span{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:16px 18px;margin-bottom:24px}
.resume p{min-width:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;margin-bottom:36px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:18px;align-content:start}
.mode h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.mode .lede{color:var(--ink-2);margin-top:4px}
.field{display:grid;gap:8px}
.field > .label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;background:var(--surface)}
.chip span em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.chip input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;width:fit-content;max-width:100%}
.seg label{position:relative;display:flex}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{padding:7px 13px;font-size:13px;font-weight:600;border-right:1px solid var(--line);background:var(--surface)}
.seg label:last-child span{border-right:0}
.seg input:checked + span{background:var(--ink);color:var(--bg)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-2px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.mode .go{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.inline-err{color:var(--bad);font-size:13px;font-weight:600}
.secondary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;min-width:0;align-content:start}
.panel h3{font-size:16px;font-weight:700}
.cov{display:grid;gap:10px}
.cov details{border-top:1px solid var(--line);padding-top:10px}
.cov summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;font-weight:600;list-style:none}
.cov summary::-webkit-details-marker{display:none}
.cov summary span{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);font-weight:500}
.cov ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px;columns:2 180px;column-gap:24px}
.hist{display:grid;gap:8px}
.hist .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hist .row b{font-family:var(--font-mono)}
.muted{color:var(--ink-2)}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px;align-items:center}
.keys > kbd{justify-self:start}
kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2);white-space:nowrap}
.foot-note{margin-top:28px;color:var(--ink-2);font-size:13px;max-width:70ch}

/* ---------- TEST ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.tb-pos{display:flex;align-items:baseline;gap:8px;min-width:0}
.tb-pos b{font-size:15px}
.mode-pill{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--ink);color:var(--bg)}
.mode-pill.practice{background:var(--accent);color:var(--accent-ink)}
.tb-sp{flex:1}
.timer{font-family:var(--font-mono);font-size:15px;font-weight:600;padding:6px 10px;border-radius:7px;background:var(--surface-2)}
.timer.warn{background:var(--bad-soft);color:var(--bad)}
.prog{height:3px;background:var(--surface-2)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.test{max-width:1180px;margin:0 auto;padding:26px 16px 140px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media (min-width:1060px){.test{grid-template-columns:minmax(0,1fr) 296px}.navpane{position:sticky;top:84px;align-self:start}.nav-open-btn{display:none!important}.nav-close{display:none!important}}
.qpane{min-width:0;max-width:780px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tag.type{background:var(--ink);color:var(--bg)}
.tag.id{font-family:var(--font-mono);font-weight:500}
.tag.step{background:var(--accent-soft);color:var(--ink)}
.stem{font-family:var(--font-read);font-size:19px;line-height:1.6;font-weight:400;max-width:68ch}
.instr{margin-top:14px;font-weight:700;font-size:14px;color:var(--ink-2)}
.opts{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;transition:border-color .12s,background-color .12s}
.opt-main{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:14px 8px 14px 14px;background:none;border:0;width:100%;min-width:0;border-radius:11px}
.opt-main:disabled{cursor:default}
.box{flex:none;width:28px;height:28px;border:2px solid var(--ink-2);display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ink-2);margin-top:1px}
.box.sq{border-radius:6px}.box.rd{border-radius:50%}
.otext{min-width:0;padding-top:3px;font-size:16px;line-height:1.5}
.opt:not(.locked):hover{border-color:var(--ink-2)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.struck .otext{text-decoration:line-through;color:var(--ink-2)}
.opt.struck .box{opacity:.5}
.strike{align-self:start;margin:10px 10px 0 0;width:34px;height:34px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-2);display:grid;place-items:center}
.strike:hover{background:var(--surface-2);border-color:var(--line)}
.strike[aria-pressed="true"]{color:var(--bad);background:var(--bad-soft)}
.strike svg{width:16px;height:16px}
.opt.hit{border-color:var(--ok);background:var(--ok-soft)}
.opt.hit .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt.miss .box{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.quiet .otext{color:var(--ink-2)}
.orat{grid-column:1 / -1;padding:0 16px 14px 56px;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.orat b{font-weight:700}
.orat .k-ok{color:var(--ok)}.orat .k-bad{color:var(--bad)}.orat .k-n{color:var(--ink)}
.verdict{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 16px;border-radius:10px;margin-top:16px;font-weight:600}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.part{background:var(--flag-soft);color:var(--flag)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.skip{background:var(--surface-2);color:var(--ink-2)}
.verdict small{font-family:var(--font-mono);font-weight:500;font-size:12.5px;color:var(--ink-2)}
.keypoint{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.keypoint p{font-size:15px}
.paused{display:grid;gap:14px;justify-items:start;padding:40px 0}
.paused h2{font-size:26px}

/* navigator */
.navpane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.navhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.navhead h3{font-size:14px;font-weight:700}
.navgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.nb{position:relative;aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--ink-2);padding:0;display:grid;place-items:center;min-width:0}
.nb.ans{background:var(--surface-2);border-color:var(--ink-2);color:var(--ink)}
.nb.skp{border-style:dashed;border-color:var(--ink-2)}
.nb.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nb.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nb.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink);font-weight:700}
.nb.flg::after{content:"";position:absolute;top:-1px;right:-1px;border-top:9px solid var(--flag);border-left:9px solid transparent;border-top-right-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:3px;border:1px solid var(--line);display:inline-block;position:relative}
.legend i.ans{background:var(--surface-2);border-color:var(--ink-2)}
.legend i.skp{border-style:dashed;border-color:var(--ink-2)}
.legend i.right{background:var(--ok-soft);border-color:var(--ok)}
.legend i.wrong{background:var(--bad-soft);border-color:var(--bad)}
.legend i.flg::after{content:"";position:absolute;top:-1px;right:-1px;border-top:7px solid var(--flag);border-left:7px solid transparent}
.navjump{display:flex;flex-wrap:wrap;gap:6px}
.navstats{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
@media (max-width:1059px){
  .navpane{display:none}
  .navpane.open{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:50;border-radius:16px 16px 0 0;max-height:78vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .nav-scrim{position:fixed;inset:0;background:var(--scrim);z-index:45}
}
@media (min-width:1060px){.nav-scrim{display:none}}

/* action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar-in{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actionbar .sp{flex:1}
.hint{font-size:12px;color:var(--ink-2)}
@media (max-width:640px){
  .stem{font-size:17.5px}
  .otext{font-size:15.5px}
  .orat{padding-left:16px}
  .btn{padding:9px 12px}
  .actionbar .lbl-long{display:none}
  .hint{display:none}
  .tb-hide-sm{display:none}
}

/* ---------- RESULTS ---------- */
.res-head{display:grid;gap:8px;margin-bottom:22px}
.res-head h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:4px}
.stat b{font-family:var(--font-mono);font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.stat p{font-size:13px;color:var(--ink-2)}
.stat.lead b{color:var(--accent)}
.breaks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px;margin-bottom:28px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,120px) 74px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.brow:first-of-type{border-top:0}
.brow .n{font-family:var(--font-mono);font-size:12.5px;text-align:right;color:var(--ink-2)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.bar i.g{background:var(--ok)}.bar i.y{background:var(--flag)}.bar i.r{background:var(--bad)}
.rfilter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.rlist{display:grid;gap:6px}
.ritem{display:grid;grid-template-columns:44px 22px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.ritem:hover{border-color:var(--ink-2)}
.ritem .num{font-family:var(--font-mono);font-size:13px;color:var(--ink-2)}
.ritem .snip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.ritem .cat{font-size:12px;color:var(--ink-2)}
.st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.st svg{width:12px;height:12px}
.st.right{background:var(--ok);color:var(--surface)}
.st.wrong{background:var(--bad);color:var(--surface)}
.st.part{background:var(--flag);color:var(--surface)}
.st.skip{border:1.5px dashed var(--ink-2)}
@media (max-width:640px){.ritem{grid-template-columns:34px 22px minmax(0,1fr)}.ritem .cat{display:none}}

/* ---------- KEY ---------- */
.keybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 20px}
.keybar select,.keybar input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:42px;max-width:100%}
.keybar input{flex:1 1 220px;min-width:0}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;margin-bottom:14px;min-width:0}
.kcard .stem{font-size:17px}
.klist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.klist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:15px;align-items:start}
.klist li .mk{font-family:var(--font-mono);font-size:12px;font-weight:600;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink-2)}
.klist li.c .mk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.klist li.c .t{font-weight:600}
.kcard details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.kcard details[open] summary{margin-bottom:10px}
.krat{display:grid;gap:8px;font-size:14px;color:var(--ink-2)}
.krat b{color:var(--ink)}

/* ---------- MODAL ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:460px;width:100%;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:20px}
.modal .counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.modal .counts div{background:var(--surface-2);border-radius:9px;padding:10px;display:grid}
.modal .counts b{font-family:var(--font-mono);font-size:22px}
.modal .counts span{font-size:12px;color:var(--ink-2)}

<script type="application/json" id="qdata">[{"id":"E11","cat":"Eye","sub":"Retinal Detachment","step":"Take Action","type":"sata","stem":"A client had a pneumatic retinopexy with an intravitreal gas bubble for a retinal detachment. Which instructions should the nurse include? Select all that apply.","options":[{"t":"You can return to heavy lifting the next day.","c":false,"r":"Activity restrictions are followed as ordered."},{"t":"Lie flat on your back as much as possible.","c":false,"r":"Lying supine moves the bubble away from most breaks."},{"t":"Learn the warning signs of detachment, because your other eye is also at risk.","c":true,"r":"Clients with one detachment are at increased risk in the other eye."},{"t":"Keep your head in the exact position prescribed, which may be face-down.","c":true,"r":"The gas bubble must press against the retinal break to seal it."},{"t":"Wear protective eyewear during sports and yard work.","c":true,"r":"Prevents eye trauma."},{"t":"Do not fly or travel to high altitudes until the gas bubble is gone.","c":true,"r":"Lower air pressure makes the bubble expand and sharply raises IOP."}],"takeaway":"Retinal detachment repair: pneumatic retinopexy, cryopexy, scleral buckle, vitrectomy. Nursing: positioning, activity limits, pain control, eye meds, teaching signs of recurrence.","fixed":false},{"id":"F15","cat":"Reproductive","sub":"Benign Prostatic Hyperplasia","step":"Take Action","type":"sata","stem":"A client returns from a transurethral resection of the prostate (TURP) with a three-way catheter and continuous bladder irrigation (CBI). Which actions should the nurse take? Select all that apply.","options":[{"t":"Adjust the irrigation rate to keep the drainage light pink or clear.","c":true,"r":"The irrigation flushes blood and clots from the bladder."},{"t":"Clamp the catheter when the client has bladder spasms.","c":false,"r":"Clamping causes retention and worsens spasms. Spasms are managed with antispasmodics and by checking for clots."},{"t":"Notify the provider if drainage becomes bright red and thick with clots and output decreases.","c":true,"r":"Bright red, thick drainage suggests arterial bleeding. Falling output may mean a clot is blocking the catheter."},{"t":"Teach the client to avoid straining during bowel movements.","c":true,"r":"Straining raises intra-abdominal pressure and can trigger bleeding."},{"t":"Subtract the irrigant volume from total output to find true urine output.","c":true,"r":"Otherwise the irrigant hides how much urine the client is making."},{"t":"Tell the client bladder control will be normal as soon as the catheter comes out.","c":false,"r":"Bladder capacity can take up to 2 months to return. Timed voiding and Kegels help with temporary incontinence."}],"takeaway":"After TURP: watch for bleeding, infection, and incontinence. Discharge: catheter care, possible ED, 2 to 3 L of fluid daily, avoid heavy lifting and straining.","fixed":false},{"id":"F20","cat":"Reproductive","sub":"Erectile Dysfunction","step":"Take Action","type":"mc","stem":"A client is prescribed sildenafil for erectile dysfunction. Which finding in the client's history requires the nurse to contact the provider before the client starts the medication?","options":[{"t":"Uses sublingual nitroglycerin for angina","c":true,"r":"PDE5 inhibitors combined with nitrates can cause severe, life-threatening hypotension."},{"t":"Has a history of BPH","c":false,"r":"Tadalafil is actually used to treat BPH symptoms."},{"t":"Has seasonal allergies","c":false,"r":"Nasal congestion is a side effect, but allergies don't contraindicate the drug."},{"t":"Takes metformin for type 2 diabetes","c":false,"r":"Diabetes is a common cause of ED, and metformin doesn't interact dangerously with sildenafil."}],"takeaway":"Teach PDE5 side effects: headache, flushing, nasal congestion, dyspepsia, back or leg pain. Get emergency care for an erection lasting over 4 hours or sudden vision or hearing loss. ED shares risk factors with cardiovascular disease.","fixed":false},{"id":"N21","cat":"Neurological","sub":"Huntington Disease","step":"Analyze Cues","type":"sata","stem":"A 38-year-old client has Huntington disease. Which findings or statements are consistent with this disorder? Select all that apply.","options":[{"t":"Tetrabenazine is given to increase dopamine in the brain.","c":false,"r":"VMAT2 inhibitors such as tetrabenazine lower dopamine to reduce chorea."},{"t":"Writhing, twisting movements of the face, arms, and trunk","c":true,"r":"Chorea is the hallmark movement disorder."},{"t":"Each of the client's children has a 50% chance of inheriting the gene.","c":true,"r":"HD is autosomal dominant."},{"t":"Difficulty swallowing","c":true,"r":"Swallowing problems develop as the disease progresses."},{"t":"Symptoms most often begin after age 70.","c":false,"r":"Symptoms usually begin between 30 and 50."},{"t":"The disease is caused by too much acetylcholine and too little dopamine.","c":false,"r":"It's the reverse: a deficiency of acetylcholine and GABA leads to excess dopamine, the opposite of PD."},{"t":"Irritability, depression, and impulsive behavior","c":true,"r":"Psychiatric symptoms are common and can appear before the movement problems."}],"takeaway":"HD: genetic, no cure, progressing to dementia. Drugs: VMAT2 inhibitors for chorea, SSRIs for mood, atypical antipsychotics for agitation or psychosis. Offer genetic counseling to the family.","fixed":false},{"id":"R15","cat":"Renal","sub":"Chronic Pyelonephritis","step":"Analyze Cues","type":"sata","stem":"A client with chronic pyelonephritis undergoes a renal biopsy. Which findings would the nurse expect in the report? Select all that apply.","options":[{"t":"Small, shrunken kidneys","c":true,"r":"Progressive scarring makes the kidneys small and atrophic, which can progress to ESRD."},{"t":"Fibrosis and scarring","c":true,"r":"Healing infection leaves scar tissue that replaces working tissue."},{"t":"Thickened glomerular basement membrane as the primary lesion","c":false,"r":"This is typical of glomerular diseases such as diabetic nephropathy, not chronic pyelonephritis."},{"t":"Increased number of glomeruli","c":false,"r":"Nephrons and glomeruli are lost, not gained."},{"t":"Infiltration of the parenchyma with inflammatory cells","c":true,"r":"Chronic infection causes ongoing inflammation of kidney tissue."},{"t":"Loss of functioning nephrons","c":true,"r":"Repeated infection destroys nephrons over time."}],"takeaway":"Chronic pyelonephritis = repeated infection, then scarring, then nephron loss, with possible progression to ESRD.","fixed":false},{"id":"E01","cat":"Eye","sub":"Cataract","step":"Recognize Cues","type":"sata","stem":"A 70-year-old with diabetes who has taken prednisone long term reports changes in vision. Which findings are consistent with cataracts? Select all that apply.","options":[{"t":"Flashes of light and a shower of floaters","c":false,"r":"These are warning signs of retinal detachment."},{"t":"Glare and halos around headlights at night","c":true,"r":"Light scatter through the opaque lens causes glare and halos."},{"t":"Blurred, cloudy vision","c":true,"r":"The clouded lens scatters light and blurs the image."},{"t":"Colors look faded or yellowed","c":true,"r":"The yellowing lens filters color."},{"t":"Sudden loss of peripheral vision","c":false,"r":"Cataracts develop gradually and blur all of the visual field."},{"t":"Severe eye pain and redness","c":false,"r":"Cataracts are painless. Severe pain with redness suggests acute angle-closure glaucoma."},{"t":"Needs frequent changes in eyeglass prescriptions","c":true,"r":"The changing lens keeps shifting the refraction."}],"takeaway":"Cataract risk: aging, diabetes (earlier onset), smoking, alcohol, UV exposure, eye injury, long-term steroids. Painless, gradual, blurred vision.","fixed":false},{"id":"N19","cat":"Neurological","sub":"Amyotrophic Lateral Sclerosis","step":"Generate Solutions","type":"sata","stem":"The nurse is caring for a client newly diagnosed with ALS and the family. Which statements by the nurse are accurate? Select all that apply.","options":[{"t":"“Most people with ALS keep their thinking and memory, so now is a good time to talk about your wishes for future care.”","c":true,"r":"Cognition is usually preserved. Early advance care planning respects autonomy before speech and breathing decline."},{"t":"“Riluzole may slow the disease and add some time, but it isn't a cure.”","c":true,"r":"Riluzole lowers glutamate levels and can add a few months to life expectancy."},{"t":"“A BiPAP machine can help when your breathing muscles weaken.”","c":true,"r":"Noninvasive ventilation supports breathing as respiratory muscles fail."},{"t":"“With treatment, most people with ALS live a normal life span.”","c":false,"r":"ALS usually leads to death in 3 to 5 years, typically from respiratory failure."},{"t":"“Memory loss is usually the first symptom.”","c":false,"r":"Early signs are motor: cramps, tripping, dropping things, slurred speech."},{"t":"“A speech therapist can set you up with a communication device for when speaking becomes hard.”","c":true,"r":"Facilitating communication is a key nursing goal."}],"takeaway":"ALS: loss of upper and lower motor neurons. Cramps, tripping, slurred speech, fasciculations, drooling, progressive weakness and atrophy. Care is supportive: function, communication, aspiration prevention, pain, falls, emotional and end-of-life support.","fixed":false},{"id":"F19","cat":"Reproductive","sub":"Testicular Cancer","step":"Analyze Cues","type":"sata","stem":"A 26-year-old has a firm, painless mass in his left testicle. Which statements by the nurse are accurate? Select all that apply.","options":[{"t":"“Having an undescended testicle as a child increases the risk.”","c":true,"r":"Cryptorchidism is a major risk factor, along with family history."},{"t":"“Treatment usually begins with removing the testicle through an incision in the groin.”","c":true,"r":"Radical inguinal orchiectomy is the primary treatment."},{"t":"“Blood tests for tumor markers such as AFP, hCG, and LDH may be ordered.”","c":true,"r":"These markers help diagnose and monitor testicular cancer."},{"t":"“A needle biopsy through the scrotum is the first step.”","c":false,"r":"A biopsy through the scrotum is avoided because it can spread tumor cells. Diagnosis uses ultrasound, tumor markers, and inguinal orchiectomy."},{"t":"“Testicular cancer usually starts with sudden, severe scrotal pain.”","c":false,"r":"Most cases present as a painless, firm mass or a heavy feeling. Acute pain is the first symptom in only about 10%."},{"t":"“You may want to talk about sperm banking before treatment.”","c":true,"r":"Surgery, chemotherapy, and radiation can affect fertility."},{"t":"“The outlook is poor even when it's found early.”","c":false,"r":"It's one of the most curable cancers; about 95% reach complete remission when found early."}],"takeaway":"Testicular cancer is the most common cancer in males age 15 to 44. Teach monthly testicular self-exam after a warm shower.","fixed":false},{"id":"G10","cat":"Genitourinary","sub":"Urinary Incontinence","step":"Generate Solutions","type":"sata","stem":"A 72-year-old in long-term care has functional incontinence. The client is alert and oriented but has limited mobility from arthritis. Which actions should the nurse include in the plan of care? Select all that apply.","options":[{"t":"Encourage coffee in the morning to stimulate voiding","c":false,"r":"Caffeine is a bladder irritant."},{"t":"Provide clothing with elastic waistbands or Velcro closures","c":true,"r":"Easy-to-remove clothing saves time getting undressed."},{"t":"Place a bedside commode and keep the path to the bathroom clear","c":true,"r":"Improving toilet access removes the barrier causing the incontinence."},{"t":"Use superabsorbent incontinence products instead of folded tissue","c":true,"r":"Products designed for urine wick moisture away and protect skin; household products don't."},{"t":"Restrict fluids to 1,000 mL per day","c":false,"r":"Fluid restriction concentrates urine, irritates the bladder, and raises the risk of UTI and dehydration."},{"t":"Schedule toileting every 3 to 4 hours while awake","c":true,"r":"Scheduled toileting builds a predictable voiding pattern."},{"t":"Insert an indwelling urinary catheter","c":false,"r":"Catheters increase infection risk and aren't used for convenience."}],"takeaway":"Functional incontinence: fix the environment, schedule toileting, protect skin and dignity.","fixed":false},{"id":"F14","cat":"Reproductive","sub":"Chronic Pelvic Pain","step":"Take Action","type":"mc","stem":"A 34-year-old has had pain below the umbilicus for 8 months. Initial testing has not found a cause. Which nursing action is most appropriate?","options":[{"t":"Explain that because no cause was found, the pain is likely psychological.","c":false,"r":"There can be a psychological component, but the pain is real and should be treated."},{"t":"Ask her to keep a journal of pain episodes, her menstrual cycle, bowel and bladder habits, and activities.","c":true,"r":"Chronic pelvic pain (6 months or longer) is hard to diagnose. A journal helps link the pain to gynecologic, GI (IBS), or urinary (IC) causes."},{"t":"Prepare her for a hysterectomy.","c":false,"r":"Hysterectomy is a last resort."},{"t":"Tell her STI testing isn't needed since she is in a monogamous relationship.","c":false,"r":"Specimens to rule out STIs and PID are part of the standard workup."}],"takeaway":"Chronic pelvic pain causes: PID, endometriosis, ovarian cysts, fibroids, adhesions, ectopic pregnancy, IBS, interstitial cystitis. Treat the cause; if none is found, treat the pain.","fixed":false},{"id":"N05","cat":"Neurological","sub":"Chronic Stroke","step":"Analyze Cues","type":"mc","stem":"Which client presentation is most consistent with an embolic stroke?","options":[{"t":"A 45-year-old who reports the worst headache of her life while lifting weights","c":false,"r":"This describes a subarachnoid hemorrhage from a ruptured aneurysm."},{"t":"A 74-year-old who wakes up with right-sided weakness that worsens over several hours","c":false,"r":"Thrombotic strokes often occur during sleep with gradual progression."},{"t":"A 60-year-old with long-standing diabetes and hypertension who has a small, deep infarct","c":false,"r":"This describes a lacunar stroke from small vessel disease."},{"t":"A 70-year-old with atrial fibrillation who suddenly develops aphasia and right arm weakness while watching TV","c":true,"r":"Embolic strokes occur while awake with sudden, immediate deficits. The embolus often comes from the heart, as with atrial fibrillation."}],"takeaway":"Ischemic (85%): thrombotic (during sleep, gradual) and embolic (awake, sudden, often AFib). Hemorrhagic (15%): intracerebral (hypertension) and subarachnoid (worst headache, exertion).","fixed":false},{"id":"N23","cat":"Neurological","sub":"Neurological Assessment","step":"Take Action","type":"mc","stem":"Six hours after a lumbar puncture, a client reports a headache that worsens when sitting up. The nurse notes clear fluid on the dressing. Which action should the nurse take first?","options":[{"t":"Help the client walk to relieve the headache.","c":false,"r":"Being upright worsens a CSF leak headache."},{"t":"Place the client flat and notify the provider of a possible CSF leak.","c":true,"r":"Leaking CSF lowers pressure and causes a positional headache. Lying flat, fluids, and analgesics help; the provider may consider a blood patch."},{"t":"Restrict oral fluids.","c":false,"r":"Fluids help the body replace CSF."},{"t":"Remove the pressure dressing and leave the site open to air.","c":false,"r":"The pressure dressing stays on, and drainage is monitored."}],"takeaway":"LP care: before, consent and void. After, lie flat for several hours as ordered, hydrate, monitor the site and headache. Normal CSF is clear and colorless with no RBCs; glucose is about two-thirds of blood glucose.","fixed":false},{"id":"E10","cat":"Eye","sub":"Retinal Detachment","step":"Prioritize Hypotheses","type":"mc","stem":"The nurse is returning calls at an eye clinic. Which client should the nurse call first?","options":[{"t":"A client with itchy, watery eyes during allergy season","c":false,"r":"Allergic conjunctivitis is not urgent."},{"t":"A client with gradually worsening blurred vision and glare when driving at night","c":false,"r":"These are typical cataract symptoms and are not urgent."},{"t":"A client with sudden flashes of light, new floaters, and a shadow like a curtain over part of the vision","c":true,"r":"These are classic signs of retinal detachment, an emergency. Delay increases the risk of permanent vision loss."},{"t":"A client who has to hold reading material farther away","c":false,"r":"This describes presbyopia."}],"takeaway":"Retinal detachment is painless. Flashes, floaters, and a curtain over vision mean an emergency.","fixed":false},{"id":"N09","cat":"Neurological","sub":"Parkinson's Disease","step":"Generate Solutions","type":"sata","stem":"Which interventions should the nurse include in the plan of care for a client with moderate Parkinson's disease? Select all that apply.","options":[{"t":"Cut food into bite-sized pieces and offer small, frequent meals.","c":true,"r":"Reduces fatigue and aspiration risk."},{"t":"Recommend slip-on shoes and clothing with Velcro fasteners.","c":true,"r":"Promotes independence with self-care despite slowed movement."},{"t":"Encourage a high-fiber diet and adequate fluids.","c":true,"r":"Constipation is common from reduced mobility and autonomic changes."},{"t":"Ask the provider for haloperidol if hallucinations occur.","c":false,"r":"Typical antipsychotics block dopamine and worsen parkinsonism."},{"t":"Remove throw rugs and extra furniture from walkways.","c":true,"r":"Environmental safety reduces falls from shuffling gait and postural instability."},{"t":"Teach the client to consciously lift the toes and use a wide stance when walking.","c":true,"r":"Counteracts the shuffling gait."},{"t":"Limit mealtimes to 15 minutes to prevent fatigue.","c":false,"r":"Bradykinesia slows eating. Clients need adequate time, and rushing raises aspiration risk."}],"takeaway":"PD has no cure, so care focuses on symptom control, independence, and preventing falls and aspiration. Drugs that can cause parkinsonism: haloperidol, phenothiazines, reserpine, methyldopa.","fixed":false},{"id":"F05","cat":"Reproductive","sub":"Fibroadenoma","step":"Analyze Cues","type":"mc","stem":"A 22-year-old has a firm, round, rubbery, nontender lump that moves freely under the examiner's fingers. Which statement by the nurse is accurate?","options":[{"t":"“Fibroadenomas commonly turn into cancer, so it must be removed today.”","c":false,"r":"Fibroadenomas are benign and rarely become malignant."},{"t":"“A biopsy will confirm what it is. If it's benign, it can be watched with regular follow-up.”","c":true,"r":"Fibroadenomas are easy to detect on exam but are definitively diagnosed by biopsy. Once cancer is ruled out, observation with monitoring is acceptable."},{"t":"“This is most likely inflammatory breast cancer.”","c":false,"r":"Inflammatory breast cancer causes a red, warm, thickened breast, often without a distinct lump."},{"t":"“No follow-up is needed because women your age don't get breast cancer.”","c":false,"r":"Every new breast lump needs evaluation. Any new lesion in a woman over 40 must be evaluated."}],"takeaway":"Fibroadenoma: young women, firm, round, rubbery, mobile, nontender. Biopsy confirms; then observe.","fixed":false},{"id":"F06","cat":"Reproductive","sub":"Breast Cancer","step":"Analyze Cues","type":"sata","stem":"A 38-year-old client's biopsy shows triple-negative breast cancer. Which statements by the nurse are accurate? Select all that apply.","options":[{"t":"“This type tends to be more aggressive than receptor-positive cancers.”","c":true,"r":"Triple-negative tumors are more aggressive with a poorer prognosis."},{"t":"“Your tumor tested negative for estrogen, progesterone, and HER-2 receptors.”","c":true,"r":"That is the definition of triple-negative."},{"t":"“Chemotherapy is usually the most effective treatment for this type.”","c":true,"r":"Chemotherapy is more successful than hormone therapy for triple-negative disease."},{"t":"“You'll receive trastuzumab, a HER-2 targeted drug.”","c":false,"r":"HER-2 targeted therapy only works for HER-2 positive tumors."},{"t":"“This type is more common in premenopausal women and women with a BRCA1 mutation.”","c":true,"r":"Incidence is also higher in Black and Hispanic women."},{"t":"“Tamoxifen will be the main part of your treatment.”","c":false,"r":"Hormone (estrogen-blocking) therapy doesn't work because the tumor has no hormone receptors."}],"takeaway":"Receptor-negative and HER-2 positive tumors are more aggressive. Prognosis worsens with larger tumor size, more lymph nodes involved, and poorer differentiation. Common metastatic sites: bone, liver, lungs, brain.","fixed":false},{"id":"G13","cat":"Genitourinary","sub":"Assessment and Diagnostics","step":"Take Action","type":"sata","stem":"A client is scheduled for a 24-hour urine collection for creatinine clearance starting at 0700. Which instructions should the nurse give? Select all that apply.","options":[{"t":"Save the 0700 void as the first specimen.","c":false,"r":"Including it adds urine produced before the timed period and gives a falsely high result."},{"t":"Keep the collection container on ice or refrigerated.","c":true,"r":"Cold storage prevents breakdown of the specimen."},{"t":"Void at 0700 the next morning and add that urine to the container.","c":true,"r":"The final void completes the 24-hour period."},{"t":"Void at 0700, discard that urine, and note the time.","c":true,"r":"The test starts with an empty bladder. That urine was made before the test period."},{"t":"If any urine is discarded by mistake, the collection must be restarted.","c":true,"r":"A missed void makes the total inaccurate."},{"t":"Save a small sample from each void instead of the whole amount.","c":false,"r":"The entire volume of every void must be saved."}],"takeaway":"24-hour urine: discard the first, keep the last, keep it cold, restart if any is lost.","fixed":false},{"id":"N18","cat":"Neurological","sub":"Myasthenia Gravis","step":"Generate Solutions","type":"sata","stem":"Which interventions should the nurse include in the plan of care for a client with myasthenia gravis? Select all that apply.","options":[{"t":"Schedule bathing and therapy for the late afternoon.","c":false,"r":"Strength is best in the morning and after rest. Weakness worsens as the day goes on."},{"t":"Teach the client to carry an emergency wallet card and avoid triggers such as infection, stress, and heat.","c":true,"r":"Preparing for a crisis and avoiding triggers lowers risk."},{"t":"Use lubricating eye drops and tape the eyes closed at night if needed.","c":true,"r":"Ptosis and incomplete eyelid closure can lead to corneal damage."},{"t":"Monitor vital capacity and the ability to cough and swallow.","c":true,"r":"Maintaining adequate ventilation is the top nursing priority."},{"t":"Give pyridostigmine on time, about 30 to 60 minutes before meals.","c":true,"r":"Peak effect at mealtime improves chewing and swallowing. Late doses can trigger weakness."},{"t":"Offer semi-solid foods and encourage the client to eat slowly.","c":true,"r":"Reduces fatigue with chewing and the risk of aspiration."},{"t":"Encourage the client to exercise until fatigued to build strength.","c":false,"r":"Exertion worsens weakness. Conserve energy and plan rest."}],"takeaway":"MG care: ventilation, medication timing, energy conservation, crisis preparation, safe eating, corneal protection. Treatments include thymectomy, plasmapheresis, and IVIG.","fixed":false},{"id":"A02","cat":"Ear","sub":"Otic Drops and Instillation","step":"Take Action","type":"sata","stem":"The nurse is teaching a parent how to give antibiotic ear drops to a 2-year-old. Which instructions should the nurse include? Select all that apply.","options":[{"t":"Keep the child lying with the treated ear up for 3 to 5 minutes.","c":true,"r":"This lets the medication reach the canal instead of running out."},{"t":"Pull the outer ear up and back.","c":false,"r":"This technique is for adults and children older than 3."},{"t":"Insert a cotton-tipped swab into the canal to keep the medicine in.","c":false,"r":"Swabs can injure the canal and eardrum."},{"t":"Warm the bottle by rolling it between your hands.","c":true,"r":"Cold drops can cause dizziness (vertigo), nausea, and pain."},{"t":"Don't let the dropper touch the ear.","c":true,"r":"Prevents contaminating the bottle."},{"t":"Gently pull the earlobe down and back.","c":true,"r":"In children under 3, this straightens the ear canal."}],"takeaway":"Otic drops: warm to body temperature, adult pinna up and back, child under 3 down and back, stay positioned 3 to 5 minutes, keep the tip clean.","fixed":false},{"id":"N08","cat":"Neurological","sub":"Parkinson's Disease","step":"Take Action","type":"sata","stem":"The nurse is teaching a client with Parkinson's disease who is starting carbidopa-levodopa. Which instructions should the nurse include? Select all that apply.","options":[{"t":"Get up slowly from lying or sitting.","c":true,"r":"Orthostatic hypotension is a common side effect."},{"t":"This medication will stop the disease from getting worse.","c":false,"r":"It reduces symptoms but does not stop progression."},{"t":"Take each dose with a high-protein snack to prevent nausea.","c":false,"r":"Protein reduces levodopa absorption. Carbidopa itself helps reduce nausea."},{"t":"Eat most of your daily protein at the evening meal.","c":true,"r":"Dietary protein competes with levodopa for absorption. Limiting protein during the day helps the drug work."},{"t":"Report new involuntary movements such as twisting or jerking.","c":true,"r":"Dyskinesias signal too much dopaminergic effect and may need a dose change."},{"t":"Stop the medication right away if you feel it isn't working.","c":false,"r":"Abrupt withdrawal can cause severe rigidity and a dangerous neuroleptic malignant-like syndrome. Doses are adjusted by the provider."}],"takeaway":"Carbidopa keeps levodopa from being broken down before it reaches the brain, so more crosses the blood-brain barrier. Other PD drugs: dopamine agonists, MAO-B inhibitors, COMT inhibitors, amantadine, anticholinergics for tremor.","fixed":false},{"id":"R03","cat":"Renal","sub":"Assessment and Diagnostics","step":"Recognize Cues","type":"sata","stem":"The nurse is screening adults at a community health fair. Which findings are considered early indicators of kidney damage in chronic kidney disease? Select all that apply.","options":[{"t":"Persistent proteinuria on two or more dipstick tests over 3 months","c":true,"r":"Persistent proteinuria (1+ or more, two or more times over 3 months) is usually the earliest sign of kidney damage."},{"t":"Uremic frost on the skin","c":false,"r":"Urea crystals on the skin are a very late finding in untreated ESRD."},{"t":"A declining glomerular filtration rate","c":true,"r":"A falling GFR is an early measure of lost filtering function and is used to stage CKD."},{"t":"Generalized edema with crackles","c":false,"r":"Fluid overload typically shows up in stages 4 and 5, when the kidneys stop responding to diuretics."},{"t":"Pericardial friction rub","c":false,"r":"Uremic pericarditis is a late complication of CKD."},{"t":"Markedly elevated serum creatinine","c":false,"r":"Creatinine does not rise much until a large share of nephrons is already lost, so it is a later indicator."}],"takeaway":"Proteinuria and a declining GFR show up first. Edema, high creatinine, and uremic signs come later.","fixed":false},{"id":"P01","cat":"Pediatric GU","sub":"Post-Streptococcal Glomerulonephritis","step":"Recognize Cues","type":"sata","stem":"A 7-year-old is brought to the clinic 10 days after recovering from strep throat. Which findings are consistent with post-streptococcal glomerulonephritis (PSGN)? Select all that apply.","options":[{"t":"Periorbital edema that is worse in the morning","c":true,"r":"Fluid retention collects around the eyes overnight."},{"t":"Elevated BUN and serum creatinine","c":true,"r":"These reflect reduced kidney function."},{"t":"Increased urine output","c":false,"r":"Reduced GFR causes decreased urine output, not polyuria."},{"t":"Urine culture positive for E. coli","c":false,"r":"PSGN is immune-mediated: antigen-antibody complexes get trapped in the glomeruli. It isn't a urinary infection."},{"t":"Blood pressure 138/92 mm Hg","c":true,"r":"Sodium and water retention cause hypertension; this is high for a 7-year-old."},{"t":"Hypotension and tachycardia","c":false,"r":"Fluid retention causes hypertension, not hypotension."},{"t":"Tea- or cola-colored urine","c":true,"r":"Hematuria from inflamed glomeruli turns the urine dark."}],"takeaway":"PSGN: school-age child 1 to 3 weeks after strep, cola-colored urine, morning periorbital edema, hypertension. Labs: elevated BUN, creatinine, and ESR.","fixed":false},{"id":"F08","cat":"Reproductive","sub":"Breast Cancer: Psychosocial","step":"Take Action","type":"mc","stem":"On the second day after a mastectomy, a client turns away during the dressing change and says, “I'm not ready to see it.” Which response by the nurse is most appropriate?","options":[{"t":"“Let's have your husband look at it first so he can tell you how it looks.”","c":false,"r":"This assumes her support preferences and takes control away from her."},{"t":"“That's okay. Many women need time. I'll tell you when the dressing is off, and you can decide when you're ready to look.”","c":true,"r":"This accepts her feelings, respects her pace, and keeps the door open. The nurse assesses her acceptance of the body image change without forcing it."},{"t":"“You'll need to look at it before discharge so you can care for your drain.”","c":false,"r":"Pressuring the client ignores her emotional readiness."},{"t":"“Don't worry, reconstruction will make it look like nothing happened.”","c":false,"r":"This is false reassurance. Reconstruction is optional and results vary."}],"takeaway":"After reproductive surgery: assess body image acceptance, allow grieving, let the client set the pace, and offer resources such as the American Cancer Society's Reach to Recovery.","fixed":false},{"id":"F18","cat":"Reproductive","sub":"Prostate Cancer","step":"Analyze Cues","type":"mc","stem":"Which digital rectal exam finding is most suggestive of prostate cancer?","options":[{"t":"Hard, nodular, asymmetric prostate","c":true,"r":"Malignant tissue feels hard and irregular. An abnormal DRE or a persistently elevated PSA leads to biopsy."},{"t":"Small, smooth, nontender prostate","c":false,"r":"This is a normal or atrophic gland."},{"t":"Smooth, rubbery, symmetrically enlarged prostate","c":false,"r":"This is typical of BPH."},{"t":"Boggy, tender, warm prostate","c":false,"r":"This suggests prostatitis."}],"takeaway":"PSA is also used to monitor treatment. After a radical prostatectomy, PSA should become undetectable; a rising PSA suggests recurrence.","fixed":false},{"id":"P02","cat":"Pediatric GU","sub":"Post-Streptococcal Glomerulonephritis","step":"Take Action","type":"sata","stem":"Which nursing interventions are appropriate for a child hospitalized with acute PSGN? Select all that apply.","options":[{"t":"Offer salty snacks to stimulate the appetite.","c":false,"r":"Sodium is limited during the edematous, hypertensive phase."},{"t":"Place the child in contact isolation.","c":false,"r":"PSGN is immune-mediated and not contagious."},{"t":"Monitor intake and output strictly.","c":true,"r":"Output is often reduced; I&O guides fluid management."},{"t":"Encourage extra fluids to flush the kidneys.","c":false,"r":"The child is retaining fluid; extra fluids worsen edema and hypertension."},{"t":"Monitor blood pressure and give antihypertensives as prescribed.","c":true,"r":"Hypertension from fluid retention is a key concern."},{"t":"Weigh the child daily on the same scale.","c":true,"r":"Daily weight tracks fluid retention and response to treatment."}],"takeaway":"PSGN care is supportive: antihypertensives, diuretics, I&O, daily weights, sodium limits during the edematous phase.","fixed":false},{"id":"G07","cat":"Genitourinary","sub":"Interstitial Cystitis","step":"Evaluate Outcomes","type":"sata","stem":"The nurse is teaching a client with interstitial cystitis (painful bladder syndrome). Which client statements indicate correct understanding? Select all that apply.","options":[{"t":"“My amitriptyline is to help with bladder pain.”","c":true,"r":"Tricyclic antidepressants are used for their pain-modifying effects, not just mood."},{"t":"“Orange juice and cranberry juice will soothe my bladder.”","c":false,"r":"Acidic juices are common bladder irritants that can worsen pain."},{"t":"“I'll avoid coffee, soda, alcohol, chocolate, and spicy foods.”","c":true,"r":"Eliminating bladder irritants relieves symptoms for many clients."},{"t":"“I'll keep a 3-day diary of when I void and how much pain I have.”","c":true,"r":"A bladder log and pain record identify triggers and guide treatment."},{"t":"“Once my symptoms go away, they won't come back.”","c":false,"r":"IC has remissions and exacerbations."},{"t":"“An antibiotic will cure this.”","c":false,"r":"IC is an inflammatory condition with an unknown cause. Urine cultures are typically negative, and antibiotics don't cure it."}],"takeaway":"IC: urgency, frequency (up to 60 times a day when severe), suprapubic pain that eases briefly after voiding. Manage irritants; TCAs, antihistamines, analgesics, Botox, cyclosporine; surgery is a last resort.","fixed":false},{"id":"N22","cat":"Neurological","sub":"Huntington Disease","step":"Take Action","type":"mc","stem":"A client with advanced Huntington disease has constant choreiform movements and has lost 4 kg this month. Which intervention is most appropriate?","options":[{"t":"Provide a clear liquid diet.","c":false,"r":"Thin liquids increase aspiration risk and can't meet caloric needs."},{"t":"Apply soft wrist restraints during meals.","c":false,"r":"Restraints increase injury and agitation."},{"t":"Provide high-calorie meals and snacks throughout the day.","c":true,"r":"Constant movement burns a lot of energy, so caloric needs are high (sometimes 4,000 to 5,000 kcal/day)."},{"t":"Limit calories to reduce the risk of choking.","c":false,"r":"Restricting calories worsens weight loss. Choking risk is managed with food texture and supervision."}],"takeaway":"HD nursing: palliative care, high calories, a safe and comfortable environment, cognitive therapy, emotional support for the client and caregivers.","fixed":false},{"id":"R14","cat":"Renal","sub":"Polycystic Kidney Disease","step":"Evaluate Outcomes","type":"sata","stem":"A client with autosomal dominant polycystic kidney disease (PKD) is started on tolvaptan. Which client statements indicate correct understanding? Select all that apply.","options":[{"t":"“Removing my kidneys is the first treatment I'll need.”","c":false,"r":"Nephrectomy is reserved for chronic, serious pain, bleeding, or infection."},{"t":"“Football is a good way for me to stay active.”","c":false,"r":"Enlarged cystic kidneys are vulnerable to trauma, so contact sports are discouraged."},{"t":"“This medicine is meant to slow the growth of the cysts in my kidneys.”","c":true,"r":"Tolvaptan is approved to slow renal cyst growth."},{"t":"“My children may want to talk with a genetic counselor.”","c":true,"r":"PKD is inherited, so family members may benefit from counseling and screening."},{"t":"“I'll call my provider if I have sudden severe flank pain or bright red urine.”","c":true,"r":"These may signal cyst rupture, bleeding, or infection."},{"t":"“I should cut back on water while I'm taking this.”","c":false,"r":"Tolvaptan blocks ADH and causes large volumes of dilute urine. Clients need to drink enough water to prevent dehydration."},{"t":"“Keeping my blood pressure controlled helps protect my kidneys.”","c":true,"r":"Hypertension is common in PKD and speeds decline in function."}],"takeaway":"PKD: hypertension, hematuria, flank or back heaviness, enlarged kidneys. Tolvaptan slows cyst growth (stay hydrated, liver function monitored). Dialysis or transplant for ESRD.","fixed":false},{"id":"P04","cat":"Pediatric GU","sub":"Hypospadias and Epispadias","step":"Take Action","type":"mc","stem":"Parents of a newborn with hypospadias ask whether their son can be circumcised before discharge. What is the nurse's best response?","options":[{"t":"“Circumcision is avoided because the foreskin may be needed for the surgical repair.”","c":true,"r":"The foreskin is often used to reconstruct the urethra."},{"t":"“Yes, circumcision will help straighten the penis.”","c":false,"r":"Circumcision doesn't correct chordee and removes tissue needed for repair."},{"t":"“Circumcision is fine, since the opening is on the top of the penis.”","c":false,"r":"That describes epispadias. In hypospadias the opening is on the underside (ventral)."},{"t":"“Repair is delayed until puberty, so circumcision now won't matter.”","c":false,"r":"Repair is usually done between 6 and 12 months of age."}],"takeaway":"Hypospadias = meatus on the underside. Epispadias = top. Chordee may be present. No circumcision. Surgery at 6 to 12 months.","fixed":false},{"id":"E08","cat":"Eye","sub":"Ophthalmic Medications","step":"Analyze Cues","type":"sata","stem":"The nurse is reviewing glaucoma medications with a client. Which statements are accurate? Select all that apply.","options":[{"t":"Acetazolamide may cause tingling in the hands and feet and kidney stones.","c":true,"r":"Carbonic anhydrase inhibitor side effects include paresthesias, tinnitus, GI upset, kidney stones, drowsiness, and depression."},{"t":"Pilocarpine constricts the pupil, so seeing in dim light may be harder.","c":true,"r":"Miotics (cholinergics) constrict the pupil and open the drainage angle; a small pupil lets in less light."},{"t":"Timolol may make the heart beat faster.","c":false,"r":"Beta-blockers slow the heart rate."},{"t":"Prostaglandin agonists lower eye pressure by increasing aqueous outflow.","c":true,"r":"They improve drainage of aqueous humor."},{"t":"Brimonidine lowers eye pressure by increasing aqueous humor production.","c":false,"r":"Alpha-adrenergic agonists decrease aqueous humor production."},{"t":"Latanoprost may permanently darken the iris and lengthen the eyelashes.","c":true,"r":"These are known effects of prostaglandin agonists."}],"takeaway":"Decrease production: beta-blockers, alpha agonists, carbonic anhydrase inhibitors. Increase outflow: prostaglandin agonists, miotics.","fixed":false},{"id":"G09","cat":"Genitourinary","sub":"Urinary Incontinence","step":"Analyze Cues","type":"sata","stem":"Which findings are consistent with stress urinary incontinence? Select all that apply.","options":[{"t":"Can't reach the bathroom in time because of arthritis","c":false,"r":"This is functional incontinence. The urinary tract works, but mobility is the barrier."},{"t":"History of three vaginal births","c":true,"r":"Childbirth stretches and weakens the pelvic floor muscles."},{"t":"Leakage that began after a radical prostatectomy","c":true,"r":"In men, prostate surgery can weaken the sphincter."},{"t":"Leaks urine when coughing, laughing, or sneezing","c":true,"r":"A sudden rise in intra-abdominal pressure overcomes a weak sphincter."},{"t":"A sudden strong urge followed by leakage before reaching the toilet","c":false,"r":"This describes urge incontinence (overactive detrusor)."},{"t":"Constant dribbling with a distended bladder","c":false,"r":"This is overflow incontinence from obstruction or neurogenic bladder."}],"takeaway":"Stress = pressure (cough, sneeze, lift). Urge = can't wait. Overflow = overfull bladder dribbling. Functional = can't get there.","fixed":false},{"id":"A01","cat":"Ear","sub":"Otitis Media","step":"Recognize Cues","type":"sata","stem":"A 3-year-old has had a cold for a week. The parent reports fussiness, ear pulling, and crying when lying down. Which findings are consistent with acute otitis media? Select all that apply.","options":[{"t":"Persistent dry cough","c":false,"r":"This fits lower respiratory or allergic conditions, not AOM."},{"t":"Temperature 101.8°F (38.8°C)","c":true,"r":"Fever is common with middle ear infection and inflammation."},{"t":"Clear nasal drainage","c":false,"r":"A cold often comes before AOM, but clear drainage alone doesn't indicate middle ear infection."},{"t":"Tugging at the right ear","c":true,"r":"Young children who can't describe ear pain often pull at the affected ear."},{"t":"Bulging, red tympanic membrane","c":true,"r":"This is the hallmark finding, caused by fluid and pressure in the middle ear."},{"t":"Pain when the tragus is pressed","c":false,"r":"Pain with tragus pressure or pinna movement is typical of external otitis."},{"t":"Irritability that worsens when lying down","c":true,"r":"Ear pain increases when lying flat."}],"takeaway":"Kids 6 months to 2 years are at highest risk because their eustachian tubes are shorter and more horizontal. Risks: bottle feeding, blocked tubes after a cold. Care: watchful waiting, analgesics, antibiotics if needed, tympanostomy tubes for recurrent cases, encourage breastfeeding.","fixed":false},{"id":"F13","cat":"Reproductive","sub":"Pelvic Organ Prolapse","step":"Recognize Cues","type":"sata","stem":"A 66-year-old client with a history of four vaginal births and chronic constipation is evaluated for a cystocele. Which findings would the nurse expect? Select all that apply.","options":[{"t":"Needing to press on the vaginal wall to have a bowel movement","c":false,"r":"Splinting to pass stool is typical of a rectocele."},{"t":"Pelvic pressure or a feeling that something is falling out","c":true,"r":"The bladder bulges into the anterior vaginal wall."},{"t":"Incomplete bladder emptying","c":true,"r":"Urine pools in the bulging part of the bladder."},{"t":"Painless hematuria","c":false,"r":"Painless hematuria raises concern for bladder cancer."},{"t":"Recurrent urinary tract infections","c":true,"r":"Residual urine promotes bacterial growth."},{"t":"Leaking urine when coughing or sneezing","c":true,"r":"A prolapsed bladder changes the angle of the urethra, causing stress incontinence."}],"takeaway":"Pelvic organ prolapse risk: aging, multiple births, obesity, chronic constipation, connective tissue disorders. Treatment: Kegel exercises, a pessary, or surgery.","fixed":false},{"id":"A04","cat":"Ear","sub":"Cerumen and Foreign Bodies","step":"Take Action","type":"mc","stem":"A client has impacted cerumen. Which instruction by the nurse is appropriate?","options":[{"t":"“Irrigate your ear with cool water to shrink the wax.”","c":false,"r":"Irrigation uses body-temperature solution. Cold or hot water stimulates the inner ear and causes vertigo and nausea."},{"t":"“Try ear candling to draw the wax out.”","c":false,"r":"Ear candling doesn't work and can cause burns."},{"t":"“Use carbamide peroxide drops as directed to soften the wax, but not if you have ear pain, drainage, or a hole in your eardrum.”","c":true,"r":"Earwax emulsifiers soften cerumen for removal. They are contraindicated with a perforated eardrum or infection."},{"t":"“Clean out the wax every day with cotton-tipped swabs.”","c":false,"r":"Swabs push wax deeper and can perforate the eardrum and damage the ossicles."}],"takeaway":"Don't irrigate with a suspected perforation. Don't try to remove an object you can't see. Kill an insect with mineral oil or lidocaine drops before removal.","fixed":false},{"id":"N12","cat":"Neurological","sub":"Multiple Sclerosis","step":"Evaluate Outcomes","type":"mc","stem":"A client with MS received the first dose of fingolimod, a sphingosine 1-phosphate (S1P) receptor modulator, 2 hours ago. Which finding requires priority follow-up?","options":[{"t":"Temperature 99.0°F (37.2°C)","c":false,"r":"Not clinically significant."},{"t":"Reports feeling tired","c":false,"r":"Fatigue is common in MS and isn't a priority here."},{"t":"Mild headache","c":false,"r":"A minor, common side effect."},{"t":"Heart rate 44 beats/min","c":true,"r":"S1P modulators can cause bradycardia and heart block, especially after the first dose, so clients are monitored afterward."}],"takeaway":"DMT side effects: interferons (flu-like symptoms, liver injury), S1P modulators (bradycardia, macular edema), monoclonal antibodies like natalizumab (infusion reactions, infections), mitoxantrone (cardiotoxicity, amenorrhea). IV corticosteroids treat acute exacerbations.","fixed":false},{"id":"E09","cat":"Eye","sub":"Macular Degeneration","step":"Generate Solutions","type":"sata","stem":"A client is newly diagnosed with wet (exudative) age-related macular degeneration. Which statements by the nurse are accurate? Select all that apply.","options":[{"t":"“Drusen deposits are the hallmark of wet AMD.”","c":false,"r":"Drusen are the hallmark of dry AMD, which accounts for about 90% of cases."},{"t":"“Injections into the eye every 4 to 6 weeks help slow vision loss.”","c":true,"r":"Anti-VEGF drugs such as ranibizumab and aflibercept halt growth of leaky new vessels."},{"t":"“If you have photodynamic therapy with verteporfin, avoid direct sunlight for 5 days.”","c":true,"r":"The light-activated drug can cause a chemical burn with sun exposure."},{"t":"“AMD affects your central vision first; side vision is usually preserved.”","c":true,"r":"The macula provides sharp central vision."},{"t":"“Treatment will restore the vision you've already lost.”","c":false,"r":"There is no cure. Treatment slows loss but doesn't reverse it."},{"t":"“Check an Amsler grid daily, one eye at a time, and report new wavy or missing lines.”","c":true,"r":"Distortion (metamorphopsia) or new blind spots (scotomas) can signal progression."},{"t":"“Eating dark leafy greens and quitting smoking may slow it down.”","c":true,"r":"Lutein, zinc, and antioxidant vitamins C and E may slow progression; smoking raises risk."}],"takeaway":"Dry AMD: drusen, slow, about 90%. Wet AMD: VEGF-driven leaky vessels, faster loss. Risk: aging, family history, obesity, hypertension, Caucasian race, smoking. Provide low-vision aids and psychosocial support.","fixed":false},{"id":"N02","cat":"Neurological","sub":"Chronic Stroke","step":"Take Action","type":"mc","stem":"A client with left homonymous hemianopsia after a stroke is eating lunch. Which action by the nurse is most appropriate at first?","options":[{"t":"Place the food in the client's intact right visual field, and teach the client to turn the head to scan to the left.","c":true,"r":"Arranging the environment within the perceptual field helps the client compensate. Scanning teaches the client to use the remaining vision."},{"t":"Patch the client's left eye.","c":false,"r":"Patching treats double vision. Hemianopsia affects the same half of the visual field in both eyes."},{"t":"Feed the client to make sure the whole meal is eaten.","c":false,"r":"This promotes dependence. The goal is compensation and independence."},{"t":"Place all the food on the left side to stimulate the affected field.","c":false,"r":"The client can't see food on the left and will leave it uneaten."}],"takeaway":"Homonymous hemianopsia = loss of the same half of the visual field in both eyes. Place items in the intact field, then teach scanning.","fixed":false},{"id":"N10","cat":"Neurological","sub":"Multiple Sclerosis","step":"Recognize Cues","type":"sata","stem":"A 32-year-old woman is being evaluated for multiple sclerosis. Which findings are consistent with MS? Select all that apply.","options":[{"t":"Pill-rolling tremor at rest","c":false,"r":"This is characteristic of Parkinson's disease."},{"t":"An electric shock sensation down the spine when she bends her neck forward","c":true,"r":"This is Lhermitte's sign."},{"t":"Urinary urgency and episodes of incontinence","c":true,"r":"Bladder dysfunction is common in MS."},{"t":"Blurred vision and pain in one eye","c":true,"r":"Optic neuritis is a common early sign."},{"t":"Drooping eyelids and jaw weakness that improve after rest, with normal sensation","c":false,"r":"Ptosis and fatigable weakness with normal sensation describe myasthenia gravis, a neuromuscular junction disease."},{"t":"Symptoms temporarily worsen after a hot shower","c":true,"r":"Uhthoff's sign: heat slows conduction in demyelinated nerves. It's a pseudo-relapse that reverses with cooling."},{"t":"Band-like squeezing pain around the chest","c":true,"r":"The MS hug comes from spasms of the intercostal and abdominal muscles."}],"takeaway":"MS: autoimmune demyelination of the CNS, usually starting between 20 and 40, 75% female. Signs: fatigue, optic neuritis, nystagmus, diplopia, ataxia, paresthesias, bowel and bladder problems.","fixed":false},{"id":"R07","cat":"Renal","sub":"Chronic Kidney Disease","step":"Take Action","type":"mc","stem":"A client receiving hemodialysis voided 300 mL in the past 24 hours. Using the usual guideline, what is the client's total fluid allowance for today?","options":[{"t":"300 mL","c":false,"r":"This is only the previous day's urine output and ignores insensible losses."},{"t":"600 mL","c":false,"r":"This covers insensible losses only and ignores the urine the client still makes."},{"t":"900 mL","c":true,"r":"Allowance = 600 mL for insensible losses + the previous day's urine output (300 mL) = 900 mL."},{"t":"1,500 mL","c":false,"r":"This much would likely cause excessive weight gain between treatments and fluid overload."}],"takeaway":"Hemodialysis fluid allowance = 600 mL + yesterday's urine output. Goal weight gain between sessions is no more than 1 to 2 kg.","fixed":true},{"id":"E02","cat":"Eye","sub":"Cataract","step":"Take Action","type":"sata","stem":"Which instructions should the nurse include in discharge teaching after phacoemulsification with an intraocular lens implant? Select all that apply.","options":[{"t":"Wear the eye shield at night.","c":true,"r":"The shield prevents rubbing or scratching the eye during sleep."},{"t":"Use the antibiotic and steroid eye drops exactly as prescribed.","c":true,"r":"Antibiotics prevent infection; steroids reduce inflammation."},{"t":"Mild eye discomfort can be relieved with acetaminophen.","c":true,"r":"Mild analgesia is expected to be enough."},{"t":"Avoid bending at the waist, heavy lifting, and straining.","c":true,"r":"These raise intraocular pressure and stress the incision."},{"t":"Report increased redness, drainage, or a decrease in vision right away.","c":true,"r":"These may signal infection or another complication."},{"t":"Severe pain is normal for the first few days.","c":false,"r":"Sudden or severe pain may mean increased IOP, hemorrhage, or infection and should be reported right away."},{"t":"Stay on bed rest for the first week.","c":false,"r":"Bed rest isn't needed; light activity is encouraged within restrictions."}],"takeaway":"After cataract surgery: drops as ordered, night shield, avoid activities that raise IOP (bending, coughing, Valsalva, lifting), keep follow-up visits.","fixed":false},{"id":"R01","cat":"Renal","sub":"Chronic Kidney Disease","step":"Recognize Cues","type":"sata","stem":"A 58-year-old client with a 15-year history of type 2 diabetes and hypertension is seen for routine follow-up. Labs: serum creatinine 2.8 mg/dL, BUN 45 mg/dL, eGFR 28 mL/min/1.73 m², potassium 5.6 mEq/L, hemoglobin 9.2 g/dL. Which findings require immediate follow-up by the nurse? Select all that apply.","options":[{"t":"Serum potassium 5.6 mEq/L","c":true,"r":"Hyperkalemia (above 5.0 mEq/L) develops as the kidneys lose the ability to excrete potassium. It can trigger life-threatening dysrhythmias."},{"t":"Urine output of 1,800 mL in 24 hours","c":false,"r":"This is adequate output. Many clients in stage 4 still make normal volumes of urine; the problem is filtration quality, not volume."},{"t":"Hemoglobin A1C 6.8%","c":false,"r":"This reflects good glycemic control for an adult with diabetes and does not need immediate action."},{"t":"Reports taking ibuprofen 400 mg daily for knee pain","c":true,"r":"NSAIDs block the prostaglandins that keep renal blood flow up. They are nephrotoxic and should be avoided in CKD."},{"t":"Blood pressure 168/94 mm Hg","c":true,"r":"Uncontrolled hypertension speeds the loss of nephrons and is one of the two leading causes of CKD. BP control is a top priority to slow progression."},{"t":"Drinks about 2 L of fluid per day","c":false,"r":"Fluids are not routinely restricted before stage 5 (ESRD) unless the client shows signs of fluid overload."},{"t":"Takes lisinopril 20 mg daily","c":false,"r":"An ACE inhibitor is the preferred antihypertensive in diabetic kidney disease because it lowers BP and reduces proteinuria. The nurse monitors potassium, but the drug itself is appropriate."}],"takeaway":"In CKD, act first on what speeds kidney loss or threatens life right now: uncontrolled BP, nephrotoxic drugs, and hyperkalemia.","fixed":false},{"id":"G01","cat":"Genitourinary","sub":"UTI: Cystitis vs Pyelonephritis","step":"Analyze Cues","type":"sata","stem":"The nurse is reviewing data for a client with a suspected urinary tract infection. Which findings indicate an upper UTI (pyelonephritis) rather than cystitis alone? Select all that apply.","options":[{"t":"White blood cell casts on urinalysis","c":true,"r":"WBC casts form in the renal tubules and show the kidney tissue itself is involved."},{"t":"Suprapubic pressure","c":false,"r":"This localizes to the bladder and is typical of cystitis."},{"t":"Urinary frequency","c":false,"r":"Frequency is a lower urinary tract symptom seen in both."},{"t":"Temperature 101.6°F (38.7°C) with chills","c":true,"r":"Fever and chills are systemic signs. Cystitis alone does not cause systemic symptoms."},{"t":"Nausea and vomiting","c":true,"r":"Systemic symptoms such as nausea, vomiting, and malaise point to an upper tract infection."},{"t":"Costovertebral angle tenderness on percussion","c":true,"r":"CVA tenderness reflects inflammation of the kidney."},{"t":"Dysuria","c":false,"r":"Dysuria is a lower urinary tract symptom seen in both cystitis and pyelonephritis."}],"takeaway":"Cystitis = lower urinary tract symptoms with no systemic signs. Pyelonephritis = fever, chills, N/V, flank pain, CVA tenderness, WBC casts.","fixed":false},{"id":"N04","cat":"Neurological","sub":"Chronic Stroke","step":"Evaluate Outcomes","type":"mc","stem":"The nurse is teaching a client who had a transient ischemic attack (TIA). Which client statement indicates a need for further teaching?","options":[{"t":"“If my symptoms come back, I'll call 911 even if they start to fade.”","c":false,"r":"This statement is accurate. There is no way to predict whether symptoms will resolve or become a stroke."},{"t":"“Since my symptoms went away completely, it wasn't serious.”","c":true,"r":"A TIA is a medical emergency. About 20% of people who have a TIA go on to have a stroke."},{"t":"“A TIA is a warning sign that I could have a stroke.”","c":false,"r":"This statement is accurate, so it shows understanding. TIA is a warning sign of progressive cerebrovascular disease."},{"t":"“Keeping my blood pressure under control lowers my risk.”","c":false,"r":"This statement is accurate. Hypertension is a major modifiable stroke risk factor."}],"takeaway":"TIA: brief focal ischemia without infarction, symptoms usually under 1 hour. The ABCD score helps predict stroke risk.","fixed":false},{"id":"R11","cat":"Renal","sub":"Chronic Kidney Disease","step":"Generate Solutions","type":"sata","stem":"A client with advanced CKD reports itching, bad breath, and constipation. Which nursing interventions are appropriate? Select all that apply.","options":[{"t":"Weigh the client daily at the same time on the same scale.","c":true,"r":"Daily weight is the best indicator of fluid status in CKD."},{"t":"Monitor stools for signs of GI bleeding.","c":true,"r":"Uremia irritates the whole GI tract; peptic ulcer disease and uremic colitis are common."},{"t":"Provide frequent oral hygiene.","c":true,"r":"Salivary urease breaks urea into ammonia, causing bad breath and stomatitis. Mouth care improves comfort and appetite."},{"t":"Apply unscented lotion to dry, itchy skin.","c":true,"r":"Uremic itching is soothed with unscented lotions; perfumed products can irritate."},{"t":"Offer ibuprofen for joint discomfort.","c":false,"r":"NSAIDs are nephrotoxic and further reduce renal blood flow."},{"t":"Give milk of magnesia for constipation.","c":false,"r":"Magnesium-containing laxatives and antacids are avoided because the kidneys can't excrete magnesium, leading to toxicity."}],"takeaway":"In CKD avoid magnesium products (milk of magnesia, some antacids), phosphate enemas, and NSAIDs.","fixed":false},{"id":"F09","cat":"Reproductive","sub":"Ovarian Cancer","step":"Recognize Cues","type":"sata","stem":"A 58-year-old woman reports several symptoms that have persisted for the past 2 months. Which findings should the nurse recognize as possible manifestations of ovarian cancer? Select all that apply.","options":[{"t":"Urinary urgency and frequency","c":true,"r":"A pelvic mass can press on the bladder."},{"t":"Feeling full quickly after eating small amounts","c":true,"r":"Early satiety and difficulty eating are classic, though vague, symptoms."},{"t":"Persistent abdominal bloating","c":true,"r":"Bloating from a growing mass or ascites is a common early complaint."},{"t":"Bleeding after intercourse","c":false,"r":"Postcoital bleeding is a classic sign of cervical cancer."},{"t":"Thin, watery vaginal discharge that becomes dark and foul-smelling","c":false,"r":"This progression is typical of cervical cancer."},{"t":"Vague pelvic or abdominal pain","c":true,"r":"Pain is often mild and easily dismissed."}],"takeaway":"Ovarian symptoms are vague and often mistaken for GI problems, so most cases are found late. For high-risk women: pelvic exam, CA-125, and transvaginal ultrasound. CA-125 is elevated in about 80% of cases but also in other conditions, so it isn't a general screening test.","fixed":false},{"id":"R17","cat":"Renal","sub":"A&P Review","step":"Analyze Cues","type":"mc","stem":"A client with CKD has anemia and decreased bone density. The nurse understands these findings result from loss of which kidney functions?","options":[{"t":"Erythropoietin production and vitamin D activation","c":true,"r":"The kidneys make erythropoietin, which stimulates RBC production, and convert vitamin D to its active form, which is needed to absorb calcium. Losing both causes anemia and CKD-MBD."},{"t":"Renin secretion and aldosterone production","c":false,"r":"Renin helps regulate BP, and aldosterone is made by the adrenal cortex. Neither explains anemia or bone loss."},{"t":"ADH production and sodium excretion","c":false,"r":"ADH is made in the hypothalamus. These affect fluid balance, not RBCs or bone."},{"t":"Glucose reabsorption and bicarbonate excretion","c":false,"r":"The kidneys reabsorb bicarbonate; losing that function causes acidosis, not anemia."}],"takeaway":"Kidney jobs: fluid and electrolyte balance, waste removal, BP control (renin), erythropoietin, vitamin D activation, acid-base balance.","fixed":false},{"id":"R13","cat":"Renal","sub":"Chronic Glomerulonephritis","step":"Analyze Cues","type":"sata","stem":"A client is being evaluated for chronic glomerulonephritis. Which statements about this condition are accurate? Select all that apply.","options":[{"t":"It is most commonly caused by a urinary tract infection.","c":false,"r":"Common causes include diabetic nephropathy, hypertension, lupus, scleroderma, viral infections, illegal drug use, and post-strepto
