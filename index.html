function filterRows(rows){
  var f = state.rFilter;
  return rows.filter(function(x){ return f === "all" ? true : f === "wrong" ? (x.status === "wrong" || x.status === "part") : f === "right" ? x.status === "right" : f === "flag" ? x.flag : x.status === "skip"; });
}
function renderReview(){
  var s = state.last, R = results(s), list = filterRows(R.rows), k = state.review;
  if (!list.length){ state.view = "results"; return renderResults(); }
  k = Math.max(0, Math.min(k, list.length - 1)); state.review = k;
  var x = list[k], q = x.q;
  var fake = { mode: "exam", optOrder: s.optOrder, answers: s.answers, struck: {}, submitted: s.submitted, flagged: s.flagged };
  var h = '<header class="topbar"><div class="topbar-in"><button class="btn sm ghost" data-act="toresults">' + ICON.left + 'Results</button><span class="mode-pill">Review</span><div class="tb-pos"><b>Question ' + (x.i + 1) + '</b><span class="muted mono">' + (k + 1) + ' of ' + list.length + ' in this list</span></div></div></header>';
  h += '<main class="test" style="grid-template-columns:minmax(0,1fr)"><section class="qpane">' + metaHTML(q, fake, true) + '<p class="stem">' + esc(q.stem.replace(/ Select all that apply\.$/, "")) + '</p><p class="instr">' + (q.type === "sata" ? "Select all that apply." : "Select one answer.") + '</p>';
  var fs = { mode: s.mode, optOrder: s.optOrder, answers: s.answers, struck: {}, submitted: s.submitted };
  h += verdictHTML(q, fs) + optionsHTML(q, fs, { feedback: true }) + '<div class="keypoint"><span class="eyebrow">Key point</span><p>' + esc(q.takeaway) + '</p></div></section></main>';
  h += '<footer class="actionbar"><div class="actionbar-in"><button class="btn" data-act="rprev"' + (k === 0 ? " disabled" : "") + '>' + ICON.left + 'Previous</button><span class="sp"></span><button class="btn primary" data-act="rnext"' + (k === list.length - 1 ? " disabled" : "") + '>Next' + ICON.right + '</button></div></footer>';
  return h;
}
function renderKey(){
  var qn = state.keyQ.trim().toLowerCase();
  var list = QUESTIONS.filter(function(q){
    if (state.keyCat !== "all" && q.cat !== state.keyCat) return false;
    if (!qn) return true;
    return (q.stem + " " + q.sub + " " + q.id + " " + q.options.map(function(o){ return o.t; }).join(" ")).toLowerCase().indexOf(qn) >= 0;
  });
  var h = '<div class="wrap"><button class="btn sm ghost" data-act="home">' + ICON.left + 'Back</button>';
  h += '<div class="res-head" style="margin-top:14px;margin-bottom:0"><p class="eyebrow">Study mode</p><h1>Answers and rationales</h1><p class="muted">Every question with its correct answers highlighted. Open a card to read why each choice is right or wrong.</p></div>';
  h += '<div class="keybar"><label class="sr" for="kcat">Content area</label><select id="kcat" data-key="cat"><option value="all">All content areas</option>' + CATS.map(function(c){ return '<option' + (state.keyCat === c ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("") + '</select><label class="sr" for="kq">Search</label><input id="kq" type="search" placeholder="Search a topic, drug, or ID" value="' + esc(state.keyQ) + '" data-key="q"><span class="muted mono" style="font-size:13px">' + list.length + ' shown</span></div>';
  h += '<div id="klist">' + keyCards(list) + '</div></div>';
  return h;
}
function keyCards(list){
  return list.map(function(q){
    return '<article class="kcard"><div class="qmeta" style="margin:0"><span class="tag mono">#' + q.num + '</span><span class="tag type">' + (q.type === "sata" ? "SATA" : "Multiple choice") + '</span><span class="tag">' + esc(q.cat) + ' · ' + esc(q.sub) + '</span><span class="tag step">' + esc(q.step) + '</span><span class="tag id">' + q.id + '</span></div>' +
      '<p class="stem">' + esc(q.stem) + '</p><ul class="klist">' + q.options.map(function(o, i){ return '<li class="' + (o.c ? "c" : "") + '"><span class="mk">' + L[i] + '</span><span class="t">' + esc(o.t) + '</span></li>'; }).join("") + '</ul>' +
      '<details><summary>Rationales</summary><div class="krat">' + q.options.map(function(o, i){ return '<p><b>' + L[i] + ' (' + (o.c ? "correct" : "incorrect") + ').</b> ' + esc(o.r) + '</p>'; }).join("") + '<p><b>Key point.</b> ' + esc(q.takeaway) + '</p></div></details></article>';
  }).join("") || '<p class="muted">No questions match that search.</p>';
}
function renderModal(){
  var m = state.modal, h = '<div class="scrim" data-act="closemodal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh" data-stop="1">';
  if (m === "end"){
    var s = state.session, ansN = s.qids.filter(function(id){ return isAnswered(s, id); }).length, fl = Object.keys(s.flagged).length, open = s.qids.length - ansN;
    var practice = s.mode === "practice";
    h += '<h2 id="mh">' + (practice ? "Finish this practice set?" : "End the exam and see your score?") + '</h2>';
    h += '<div class="counts"><div><b>' + ansN + '</b><span>' + (practice ? "Submitted" : "Answered") + '</span></div><div><b>' + open + '</b><span>' + (practice ? "Not submitted" : "Unanswered") + '</span></div><div><b>' + fl + '</b><span>Flagged</span></div></div>';
    h += '<p class="muted">' + (practice ? "Questions you didn't submit won't be scored." : open ? "Unanswered questions are scored as incorrect." : "Every question has an answer.") + '</p>';
    h += '<div class="acts">' + (open ? '<button class="btn" data-act="m-open">Go to unanswered</button>' : '') + (fl ? '<button class="btn" data-act="m-flag">Review flagged</button>' : '') + '<button class="btn" data-act="closemodal">Keep working</button><button class="btn primary" data-act="m-finish">' + (practice ? "Finish" : "Score exam") + '</button></div>';
  } else if (m === "timeup"){
    h += '<h2 id="mh">Time is up</h2><p class="muted">Your exam was scored with the answers you had entered.</p><div class="acts"><button class="btn primary" data-act="closemodal">See results</button></div>';
  } else if (m === "discard"){
    h += '<h2 id="mh">Discard the session in progress?</h2><p class="muted">Your answers for this session will be deleted. Saved history, flags, and missed questions stay.</p><div class="acts"><button class="btn" data-act="closemodal">Cancel</button><button class="btn primary" data-act="m-discard">Discard</button></div>';
  } else if (m === "reset"){
    h += '<h2 id="mh">Clear saved data?</h2><p class="muted">This removes your attempt history, flagged questions, and missed-question list from this browser.</p><div class="acts"><button class="btn" data-act="closemodal">Cancel</button><button class="btn primary" data-act="m-reset">Clear</button></div>';
  }
  return h + '</div></div>';
}

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "closemodal" && e.target.closest("[data-stop]") && !e.target.closest("button[data-act='closemodal']")) return;
  var a = el.dataset.act, s = state.session;
  switch (a){
    case "start": start(el.dataset.mode); break;
    case "resume": state.view = "test"; render(); break;
    case "discard": state.modal = "discard"; render(); break;
    case "m-discard": state.session = null; store.del(K.session); state.modal = null; render(); break;
    case "resetdata": state.modal = "reset"; render(); break;
    case "m-reset": store.del(K.history); store.del(K.flags); store.del(K.missed); state.modal = null; render(); toast("Saved data cleared"); break;
    case "home": if (s && !s.finished) save(); state.view = "home"; state.modal = null; render(); window.scrollTo(0,0); break;
    case "key": state.view = "key"; render(); window.scrollTo(0,0); break;
    case "lastres": state.view = "results"; render(); window.scrollTo(0,0); break;
    case "pick": pick(parseInt(el.dataset.i, 10)); break;
    case "strike": strike(parseInt(el.dataset.i, 10)); break;
    case "submit": submitQ(); break;
    case "next": nextOrFinish(); break;
    case "prev": go(s.cur - 1); break;
    case "flag": toggleFlag(); break;
    case "goto": go(parseInt(el.dataset.i, 10)); break;
    case "nav": state.navOpen = !state.navOpen; render(); break;
    case "nextflag": var f = firstWhere(function(id){ return s.flagged[id]; }); if (f >= 0) go(f); break;
    case "nextopen": var o = firstWhere(function(id){ return !isAnswered(s, id); }); if (o >= 0) go(o); break;
    case "pause": s.paused = !s.paused; save(); render(); break;
    case "end": openEnd(); break;
    case "closemodal": state.modal = null; render(); break;
    case "m-open": state.modal = null; var u = s.qids.findIndex(function(id){ return !isAnswered(s, id); }); if (u >= 0) go(u); else render(); break;
    case "m-flag": state.modal = null; var g = s.qids.findIndex(function(id){ return s.flagged[id]; }); if (g >= 0) go(g); else render(); break;
    case "m-finish": state.modal = null; finish(false); break;
    case "rev": state.review = parseInt(el.dataset.k, 10); state.view = "review"; render(); window.scrollTo(0,0); break;
    case "rprev": state.review--; render(); window.scrollTo(0,0); break;
    case "rnext": state.review++; render(); window.scrollTo(0,0); break;
    case "toresults": state.view = "results"; render(); break;
    case "retry":
      var R = results(state.last); var ids = R.rows.filter(function(x){ return x.status !== "right"; }).map(function(x){ return x.id; });
      var ns = { id: Date.now().toString(36), mode:"practice", qids: ids, optOrder:{}, answers:{}, submitted:{}, flagged:{}, struck:{}, visited:{}, cur:0, elapsed:0, paused:false, timeLimit:0, startedAt:Date.now(), finished:false };
      ids.forEach(function(id){ ns.optOrder[id] = state.last.optOrder[id] || QMAP[id].options.map(function(_, i){ return i; }); if (state.last.flagged[id]) ns.flagged[id] = true; });
      ns.visited[ids[0]] = true; state.session = ns; save(); state.view = "test"; render(); window.scrollTo(0,0); break;
  }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.dataset.pref){
    var k = t.dataset.pref;
    if (k === "pCats"){ prefs.pCats = Array.prototype.slice.call(document.querySelectorAll('input[data-pref="pCats"]:checked')).map(function(x){ return x.value; }); }
    else if (t.type === "checkbox") prefs[k] = t.checked;
    else prefs[k] = t.value;
    savePrefs(); state.homeErr = "";
    if (k === "pSource" || k === "pCats") render();
    return;
  }
  if (t.name === "rFilter"){ state.rFilter = t.value; render(); return; }
  if (t.dataset.key === "cat"){ state.keyCat = t.value; render(); }
});
document.addEventListener("input", function(e){
  if (e.target.dataset.key === "q"){ state.keyQ = e.target.value; var qn = state.keyQ.trim().toLowerCase();
    var list = QUESTIONS.filter(function(q){ if (state.keyCat !== "all" && q.cat !== state.keyCat) return false; if (!qn) return true; return (q.stem + " " + q.sub + " " + q.id + " " + q.options.map(function(o){ return o.t; }).join(" ")).toLowerCase().indexOf(qn) >= 0; });
    document.getElementById("klist").innerHTML = keyCards(list);
    var c = e.target.nextElementSibling; if (c) c.textContent = list.length + " shown";
  }
});
document.addEventListener("keydown", function(e){
  if (e.target.closest && e.target.closest("input,select,textarea")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (state.modal){ if (e.key === "Escape"){ state.modal = null; render(); } return; }
  if (state.view === "review"){
    if (e.key === "ArrowRight"){ var list = filterRows(results(state.last).rows); if (state.review < list.length - 1){ state.review++; render(); } }
    if (e.key === "ArrowLeft" && state.review > 0){ state.review--; render(); }
    return;
  }
  if (state.view !== "test") return;
  var s = state.session; if (s.paused) return;
  var q = curQ(), order = s.optOrder[q.id] || q.options.map(function(_, i){ return i; });
  var key = e.key.toLowerCase(), pos = -1;
  if (/^[1-8]$/.test(key)) pos = parseInt(key, 10) - 1;
  else if (key.length === 1 && "abcdefgh".indexOf(key) >= 0) pos = "abcdefgh".indexOf(key);
  if (pos >= 0 && pos < order.length && !(e.target.closest && e.target.closest("button") && key === " ")){ e.preventDefault(); pick(order[pos]); return; }
  if (key === "m"){ e.preventDefault(); toggleFlag(); return; }
  if (e.key === "ArrowRight"){ e.preventDefault(); if (s.cur < s.qids.length - 1) go(s.cur + 1); return; }
  if (e.key === "ArrowLeft"){ e.preventDefault(); if (s.cur > 0) go(s.cur - 1); return; }
  if (e.key === "Escape" && state.navOpen){ state.navOpen = false; render(); return; }
  if (e.key === "Enter" && !(e.target.closest && e.target.closest("button"))){
    e.preventDefault();
    if (s.mode === "practice" && !s.submitted[q.id] && (s.answers[q.id] || []).length) submitQ(); else nextOrFinish();
  }
});
window.addEventListener("pagehide", save);
render();
})();
</script>
